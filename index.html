<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earmark: track spending, plan bills, save for goals</title>
<meta name="description" content="Earmark is a free money tracker. Record spending in seconds, plan your bills, save for goals and keep track of debts. Your data stays on your phone.">
<meta property="og:title" content="Earmark: your money tracker">
<meta property="og:description" content="Track spending, plan bills, save for goals. Free, no sign-up, your data stays on your phone.">
<meta property="og:image" content="https://earmarkapp.github.io/icons/icon-512.png">
<meta property="og:url" content="https://earmarkapp.github.io/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Earmark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --ink2:#3A3A3C; --muted:#6E6E73; --faint:#AEAEB2; --line:#E3E3E8; --fill:#EBEBF0;
  --primary:#000000; --on-primary:#FFFFFF;
  --in:#1E8E3E; --out:#D70015; --warn:#C93400;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--ink2:#D1D1D6;--muted:#98989F;--faint:#636366;--line:#38383A;--fill:#2C2C2E;--primary:#FFFFFF;--on-primary:#000000;--in:#30D158;--out:#FF453A;--warn:#FF9F0A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .pos{color:var(--in)} .neg{color:var(--out)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 100px)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 4px 14px}
.top h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
.top .acts{display:flex;gap:8px}
.top .back{display:flex;align-items:center;gap:2px;font-size:17px;color:var(--ink2);font-weight:500}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink2);font-size:19px}

.group{background:var(--card);border-radius:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 8px}
.ghead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:.01em}
.ghead button{font-size:15px;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 14px;width:100%;text-align:left;min-height:52px}
.row>.main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 0;border-bottom:.5px solid var(--line);align-self:stretch}
.row:last-child>.main{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16.5px;font-weight:600;white-space:nowrap;text-align:right}
.row .amt.in{color:var(--in)}
.row .chev{color:var(--faint);font-size:15px;display:flex}
.sq{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.sq.lg{width:44px;height:44px;border-radius:11px;font-size:22px}
.badge{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:9.5px;letter-spacing:-.02em;flex:none}
.badge.lg{width:44px;height:44px;border-radius:11px;font-size:12px}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--muted);margin:22px 16px 6px}
.empty{text-align:center;color:var(--muted);padding:26px 18px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;background:var(--card);border-radius:12px;padding:6px}
.monthbar .m{font-weight:600;font-size:17px}
.monthbar button{width:40px;height:36px;border-radius:9px;font-size:18px;color:var(--ink2);display:grid;place-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair>div{padding:12px 16px}
.pair>div+div{border-left:.5px solid var(--line)}
.pair .l{font-size:13px;color:var(--muted)}
.pair .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;margin-top:2px}
.bar{height:5px;background:var(--fill);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ink)}
.bar.over i{background:var(--out)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;padding:7px 6px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){.seg button.on{background:#636366}}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--fill);color:var(--ink2);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;vertical-align:1px}
.chip.ok{color:var(--in)} .chip.bad{color:var(--out)} .chip.warn{color:var(--warn)}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent;font-size:14px}
.tick.on{background:var(--in);border-color:var(--in);color:#fff}
.done .t,.done .amt{color:var(--faint)}
.paybtn{background:var(--fill);color:var(--ink);font-weight:600;font-size:14px;padding:6px 13px;border-radius:999px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:13px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:17px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.sheet .btn.ghost{background:var(--fill)}
.btn.danger{background:var(--card);color:var(--out)}
.sheet .btn.danger{background:var(--fill)}
.btns{display:grid;gap:10px;margin-top:16px}
.hint{font-size:13px;color:var(--muted);margin:8px 16px 0;line-height:1.4}

/* home */
.bal{padding:16px 16px 6px}
.bal .l{font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.bal .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.bal .v small{font-size:22px;font-weight:600;color:var(--muted);margin-right:4px}
.spend .v{font-size:24px}
.rec2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rec2 button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--card);font-weight:600;font-size:17px}
.rec2 .sym{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#fff;flex:none}
.rec2 .bo .sym{background:var(--out)} .rec2 .bi .sym{background:var(--in)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--faint);padding:2px 0}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--ink)}
nav.tabs .plus{width:46px;height:46px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
nav.tabs .plus svg{width:24px;height:24px;stroke-width:2.4}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:35}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1);z-index:36;max-height:92vh;overflow:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:9px;background:var(--faint);opacity:.5;margin:0 auto 14px}
.sheet h2{margin:0 4px 16px;font-size:22px;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:10px;border:0;background:var(--card);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
.field input:focus,.field select:focus{box-shadow:0 0 0 2px var(--ink)}
.field .big{font-family:var(--num);font-size:28px;font-weight:700;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:14px;font-weight:500}
.toggle small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.sw{width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:#34C759} .sw.on::after{transform:translateX(20px)}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.picker button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--card);font-size:13px;font-weight:500;border:2px solid transparent}
.picker button.on{border-color:var(--ink)}
.search{width:100%;padding:10px 14px;border-radius:10px;border:0;background:var(--fill);margin-bottom:10px;font-size:17px}
.mchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchips button{padding:9px 0;border-radius:9px;background:var(--card);font-weight:600;font-size:13px}
.mchips button.on{background:var(--primary);color:var(--on-primary)}
.irow{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:6px}
.irow input{padding:11px;border-radius:9px;border:0;background:var(--card);width:100%}
.irow button,.prow button{border-radius:9px;background:var(--card);color:var(--out);font-size:16px}
.prow{display:grid;grid-template-columns:1fr 82px 46px 46px 32px;gap:5px;margin-bottom:4px}
.prow input{padding:10px;border-radius:9px;border:0;background:var(--card);width:100%;font-size:15px}
.linkbtn{font-weight:600;font-size:15px;padding:6px 4px}
.selrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:10px;padding:8px 14px;min-height:52px}
.selrow .tx{flex:1}

/* record sheet */
.rec{position:fixed;inset:0;margin:0 auto;max-width:560px;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1);padding-top:env(safe-area-inset-top)}
.rec.on{transform:none}
.rec-top{display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.rec-top .seg{flex:1}
.rec-amt{text-align:center;padding:10px 16px 2px}
.rec-amt .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;font-size:50px;letter-spacing:-.02em;line-height:1.1}
.rec-amt .v small{font-size:24px;color:var(--muted);font-weight:600;margin-right:4px}
.rec[data-t=expense] .rec-amt .v{color:var(--out)} .rec[data-t=income] .rec-amt .v{color:var(--in)}
.rec-meta{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none;justify-content:center}
.rec-meta::-webkit-scrollbar{display:none}
.mchip{position:relative;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:6px 12px;border-radius:9px;background:var(--card);font-weight:500;font-size:15px;flex:none}
.mchip .badge{width:22px;height:22px;border-radius:6px;font-size:7.5px}
.mchip.on{box-shadow:0 0 0 1.5px var(--ink)}
.mchip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.rec-lbl{font-size:13px;color:var(--muted);padding:4px 20px 6px}
.rec-note{padding:0 16px 8px}
.rec-note input{width:100%;padding:11px 14px;border-radius:10px;border:0;background:var(--card)}
.rec-cats{flex:1;overflow-y:auto;padding:4px 10px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-content:start}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:12px;font-size:12px;font-weight:500;text-align:center;line-height:1.2;color:var(--ink2)}
.cat .sq{width:46px;height:46px;border-radius:13px;font-size:22px}
.cat.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 2px var(--ink) inset}
.rec-acc{flex:1;overflow-y:auto;padding:4px 16px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--fill)}
.keys button{height:50px;border-radius:9px;background:var(--card);font-family:var(--num);font-size:24px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.18);display:grid;place-items:center}
.keys .act{font-size:16px;font-family:var(--sys);color:var(--ink2)}
.keys .save{grid-row:span 2;height:auto;background:var(--primary);color:var(--on-primary);font-family:var(--sys);font-size:17px;font-weight:600}
.keys .save:disabled{opacity:.3}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:12px;font-weight:500;font-size:15px;opacity:0;transition:all .22s;z-index:50;pointer-events:none;max-width:92vw;display:flex;gap:14px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{font-weight:700;opacity:.75}

.welcome{min-height:calc(100vh - 100px);display:flex;flex-direction:column;justify-content:flex-end;padding:20px 4px 10px}
.welcome .mark{width:64px;height:64px;border-radius:15px}
.welcome h1{font-size:36px;font-weight:700;letter-spacing:.005em;line-height:1.1;margin:0 0 12px}
.welcome p{color:var(--muted);margin:0 0 28px;font-size:17px;line-height:1.45;max-width:30ch}
.welcome .hint{max-width:none;margin:16px 0 0;text-align:center}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:26px 0 4px}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:72px;padding:6px 14px 10px}
.hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.hist i{display:block;width:60%;background:var(--in);border-radius:4px 4px 1px 1px;min-height:3px}
.hist i.miss{background:var(--fill)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:.5px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.kv.total{font-weight:600}
.card-pad{padding:14px 16px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Records</button>
  <button data-act="rec" data-t="expense" aria-label="Record"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>Plan</button>
  <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>More</button>
</div></nav>
<div id="scrim" data-act="close"></div>
<div class="sheet" id="sheet"></div>
<div class="rec" id="rec"></div>
<div id="toast"></div>
<input type="file" id="filein" accept=".json,application/json,.csv,text/csv" hidden>

<script>
/* ===== Settings you can change ===== */
const CONFIG = {

};
</script>

  s.accounts=s.accounts||[];s.items=s.items||[];s.goals=s.goals||[];s.incomes=s.incomes||[];

}

/* ---------- model ---------- */
const S=()=>D.settings;
const items=()=>S().items, accounts=()=>S().accounts, groups=()=>S().groups, goals=()=>S().goals, incomes=()=>S().incomes, cats=()=>S().categories;
const acc=id=>accounts().find(a=>a.id===id);
const isSpend=a=>!!a&&SPEND.has(a.type);
const itemActive=(t,m)=>(!t.start||t.start<=m)&&(!t.end||m<t.end);
function amountFor(t,m){let a=0;const l=(t.amounts||[]).slice().sort((x,y)=>x.from<y.from?-1:1);for(const e of l)if(e.from<=m)a=e.amount;return a}
const monthDoc=m=>D.months[m]||{};
const groupName=id=>{const g=groups().find(g=>g.id===id);return g?g.name:(id==="oneoff"?"One-off":"Others")};
const groupColor=id=>{const g=GROUPS.find(g=>g[0]===id);if(g)return g[2];const i=groups().findIndex(g=>g.id===id);return ["#30B0C7","#FF2D55","#5856D6","#FF9500"][Math.max(0,i)%4]};
function catOf(name,type){return cats().find(c=>c.type===type&&c.name.toLowerCase()===String(name||"").toLowerCase())}
function catGroup(name){const c=catOf(name,"expense");return c&&c.group?c.group:"other";}
function catIcon(name,type){const c=catOf(name,type);return c?c.icon:(type==="income"?"coins":"tag")}
function catColor(name,type){return type==="income"?"#34C759":groupColor(catGroup(name))}
function icoHTML(icon,color,lg){return `<span class="sq ${lg?"lg":""}" style="background:${color}">${ic(icon)}</span>`}
const H=()=>D&&S().hide;
function prov(a){const p=ALLP.find(p=>p[0]===a.provider&&(providersFor(a.type,a.kind).some(x=>x[0]===a.provider)));return p||["other",a.name,"#6B7088",null]}
function badgeHTML(a,lg){const p=prov(a);if(a.type==="cash")return icoHTML("banknote","#34C759",lg);const short=(p[0]==="other"||!p[3])?(a.name.split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase()||"?"):p[3];const fg=lum(p[2])>.6?"#1C1C1E":"#fff";return `<span class="badge ${lg?"lg":""}" style="background:${p[2]};color:${fg}">${esc(short)}</span>`}
function spentOn(m,cat){const n=String(cat).toLowerCase();return r2(D.tx.filter(x=>x.type==="expense"&&ymOf(x.date)===m&&String(x.category||"").toLowerCase()===n&&!x.plan).reduce((a,x)=>a+x.amount,0))}

const incomeActive=(s,m)=>itemActive(s,m)&&(s.freq!=="custom"||(s.months||[]).includes(+m.slice(5)));
function incomeLines(m){const d=monthDoc(m).incomes||{};return incomes().filter(s=>incomeActive(s,m)).map(s=>{const o=d[s.id]||{};return o.skip?null:{key:"i:"+s.id,id:s.id,name:s.name,amount:o.amount!=null?o.amount:amountFor(s,m),received:!!o.received,txId:o.txId||null,category:s.category||s.name,account:s.account||null,freq:s.freq}}).filter(Boolean);}
const incomeTotal=m=>r2(incomeLines(m).reduce((s,l)=>s+l.amount,0));

function goalSaved(g){return r2((g.initial||0)+D.tx.filter(x=>x.goalId===g.id).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0))}
const goalTarget=g=>g.parts&&g.parts.length?r2(g.parts.reduce((s,p)=>s+(+p.amount||0),0)):(g.target||0);
const goalMonthsLeft=g=>g.targetMonth?Math.max(1,mDiff(thisYM(),g.targetMonth)+1):null;
function goalNeeded(g){const left=Math.max(0,goalTarget(g)-goalSaved(g)),n=goalMonthsLeft(g);if(!n)return null;const paidThis=planLines(thisYM()).some(l=>l.key==="g:"+g.id&&l.paid);return r2(left/(paidThis?Math.max(1,n-1):n));}
const goalSavedIn=(g,m)=>r2(D.tx.filter(x=>x.goalId===g.id&&ymOf(x.date)===m).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0));
const earmarkedGoals=()=>r2(goals().filter(g=>!g.account).reduce((s,g)=>s+Math.max(0,goalSaved(g)),0));

function planLines(m){
  const d=monthDoc(m),out=[],L=d.lines||{};
  for(const t of items()){
    if(!itemActive(t,m))continue;const l=L[t.id]||{};if(l.skip)continue;
    const o={key:t.id,id:t.id,name:t.name,group:t.group,kind:t.kind||"fixed",amount:l.amount!=null?l.amount:amountFor(t,m),paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:l.dueDay||t.dueDay||null,note:t.note||"",category:t.category||t.name,payFrom:t.payFrom||null,payTo:t.payTo||null};
    if(o.kind==="budget")o.spent=spentOn(m,o.category);out.push(o);
  }
  for(const g of goals()){
    if(g.done||!g.inPlan||!(g.monthly>0))continue;if((g.start&&m<g.start)||(g.targetMonth&&m>g.targetMonth))continue;
    const l=L["g:"+g.id]||{};if(l.skip)continue;
    out.push({key:"g:"+g.id,id:g.id,goal:g,name:"Save for "+g.name,group:"_goals",kind:"fixed",amount:l.amount!=null?l.amount:g.monthly,paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:g.dueDay||null,note:"",category:"Savings",payFrom:null,payTo:g.account||null});
  }
  for(const x of (d.extras||[]))out.push({key:"x:"+x.id,id:x.id,name:x.name,group:x.group||"oneoff",kind:"fixed",amount:x.amount,paid:!!x.paid,paidOn:x.paidOn||null,txId:x.txId||null,dueDay:x.dueDay||null,note:x.note||"",category:x.category||x.name,payFrom:null,payTo:null,extra:true});
  return out;
}
const fromCash=l=>!l.payFrom||isSpend(acc(l.payFrom));
function lineReserved(l){if(!fromCash(l))return 0;if(l.kind==="budget")return l.paid?0:Math.max(0,r2(l.amount-l.spent));return l.paid?0:l.amount;}
const findLine=(m,key)=>planLines(m).find(l=>l.key===key);
function dueText(l,m){if(!l.dueDay)return null;const due=m+"-"+pad(l.dueDay),late=!l.paid&&m===thisYM()&&todayStr()>due;return {txt:late?"Overdue, was due "+ord(l.dueDay):"Due "+ord(l.dueDay),late};}

function billedCount(p,upto){if(!p.from||!p.end)return 0;const end=p.end&&p.end<upto?p.end:upto;return Math.max(0,mDiff(p.from,end)+1)}
function accBalance(a){
  let b=a.opening||0;
  for(const x of D.tx){
    if(x.type==="income"&&x.account===a.id)b+=x.amount;
    else if(x.type==="expense"&&x.account===a.id)b-=x.amount;
    else if(x.type==="transfer"){if(x.account===a.id)b-=x.amount;if(x.toAccount===a.id)b+=x.amount;}
  }
  if(a.type==="debt")for(const p of a.plans||[])b-=p.monthly*billedCount(p,thisYM());
  return r2(b);
}
const cashTotal=()=>r2(accounts().filter(isSpend).reduce((s,a)=>s+accBalance(a),0));
const stmtOwed=a=>r2(Math.max(0,-accBalance(a)));
function unbilled(a){const m=thisYM();return r2((a.plans||[]).reduce((s,p)=>s+p.monthly*Math.max(0,p.end?mDiff(m,p.end):0),0))}
const owed=a=>r2(stmtOwed(a)+unbilled(a));
function bcMonthly(a,m){m=m||thisYM();return r2((a.plans||[]).filter(p=>p.end&&p.end>=m&&(!p.from||p.from<=m)).reduce((s,p)=>s+p.monthly,0))}
function paidIn(a,m){return r2(D.tx.filter(x=>x.type==="transfer"&&x.toAccount===a.id&&ymOf(x.date)===m).reduce((s,x)=>s+x.amount,0))}
const bcDue=a=>r2(Math.max(0,bcMonthly(a)-paidIn(a,thisYM())));
const nonBC=a=>r2(Math.max(0,stmtOwed(a)-bcDue(a)));
function setNonBC(a,v){const target=-(Math.abs(v)+bcDue(a));a.opening=r2((a.opening||0)+(target-accBalance(a)));}
const totalDebt=()=>r2(accounts().filter(a=>a.type==="debt").reduce((s,a)=>s+owed(a),0));
function linkedMonthly(a,m){m=m||thisYM();return r2(items().filter(i=>i.payTo===a.id&&itemActive(i,m)).reduce((s,i)=>s+amountFor(i,m),0))}
function payoff(a){
  const P=linkedMonthly(a);let bal=stmtOwed(a);const r=(a.rate||0)/1200;let m=thisYM(),interest=0,n=0;
  if(!P)return null;
  const paidNow=planLines(m).filter(l=>l.payTo===a.id).every(l=>l.paid);
  if(!paidNow)bal-=P;
  while(n<480){
    if(bal<=0.005&&!(a.plans||[]).some(p=>p.end&&p.end>m))break;
    n++;m=addM(m,1);
    if(bal>0){const i=bal*r;interest+=i;bal+=i;}
    for(const p of a.plans||[])if(p.end&&p.end>=m&&(!p.from||p.from<=m))bal+=p.monthly;
    bal-=P;
    if(n>12&&bal>owed(a)+1)return {never:true};
  }
  if(n>=480)return {never:true};
  return {months:n,done:m,interest:r2(interest)};
}
function defAcc(){const id=S().lastAccount;if(id&&isSpend(acc(id)))return id;const a=accounts().find(a=>a.type==="bank")||accounts().find(isSpend)||accounts()[0];return a?a.id:""}
function safeToSpend(){
  const m=thisYM(),lines=planLines(m);
  const planned=r2(lines.filter(l=>l.kind!=="budget").reduce((t,l)=>t+lineReserved(l),0));
  const budgets=r2(lines.filter(l=>l.kind==="budget").reduce((t,l)=>t+lineReserved(l),0));
  const goalsHeld=earmarkedGoals();
  return {cash:cashTotal(),planned,budgets,goalsHeld,safe:r2(cashTotal()-planned-budgets-goalsHeld)};
}

/* ---------- mutations ---------- */
function mutMonth(m,fn){D.months[m]=D.months[m]||{};fn(D.months[m]);}
function setLine(m,l,patch){mutMonth(m,d=>{if(l.extra){d.extras=(d.extras||[]).map(x=>x.id===l.id?Object.assign(x,patch):x);}else{d.lines=d.lines||{};const o=Object.assign(d.lines[l.key]||{},patch);for(const k in o)if(o[k]===null||o[k]===undefined)delete o[k];d.lines[l.key]=o;}});}
function setInc(m,id,patch){mutMonth(m,d=>{d.incomes=d.incomes||{};const o=Object.assign(d.incomes[id]||{},patch);for(const k in o)if(o[k]===null||o[k]===undefined)delete o[k];d.incomes[id]=o;});}
const delTx=id=>{D.tx=D.tx.filter(x=>x.id!==id)};
function putTx(t){const i=D.tx.findIndex(x=>x.id===t.id);if(i>=0)D.tx[i]=t;else D.tx.push(t);}
function ensureCat(name,type,group,icon){if(!name)return;if(!catOf(name,type))cats().push(type==="income"?{name,type,icon:icon||"coins"}:{name,type,group:group||"other",icon:icon||"tag"});}
function goalTx(g,amt,from,date,withdraw,extra){
  const t=Object.assign({id:rid(),amount:amt,date,goalId:g.id,created:Date.now(),category:g.name,note:""},extra||{});
  if(withdraw)t.withdraw=true;
  if(extra&&extra.type==="save"){t.type="save";t.account=from;}
  else if(g.account){t.type="transfer";if(withdraw){t.account=g.account;t.toAccount=from}else{t.account=from;t.toAccount=g.account}}
  else{t.type="save";t.account=from;}
  putTx(t);return t.id;
}
/* when a recording matches an unpaid planned payment, tick it off */
function autoLink(t){
  if(t.plan||t.goalId)return null;
  const m=ymOf(t.date);
  const l=planLines(m).find(l=>!l.paid&&l.kind!=="budget"&&!l.goal&&(t.type==="transfer"?(l.payTo&&l.payTo===t.toAccount):(t.type==="expense"&&!l.payTo&&String(l.category).toLowerCase()===String(t.category).toLowerCase())));
  if(!l)return null;
  t.plan={m,k:l.key};const patch={paid:true,paidOn:t.date,txId:t.id};if(r2(t.amount)!==r2(l.amount))patch.amount=t.amount;setLine(m,l,patch);return l;
}
function autoLinkIncome(t){
  if(t.plan||t.type!=="income")return null;const m=ymOf(t.date);
  const l=incomeLines(m).find(l=>!l.received&&String(l.category).toLowerCase()===String(t.category).toLowerCase());

function unlinkTx(ex){if(!ex.plan)return;const {m,k}=ex.plan;if(k.startsWith("i:"))setInc(m,k.slice(2),{received:null,txId:null});else{const l=findLine(m,k);if(l)setLine(m,l,{paid:false,paidOn:null,txId:null});}}

/* Card payoff plan: pay BC dues, then clear non-BC (highest interest first), then save the rest to settle BCs early (smallest first). */
function cardPlan(){
  const m0=thisYM();
  const cards=accounts().filter(a=>a.type==="debt"&&!isLoan(a.kind)&&(owed(a)>0));
  if(!cards.length)return null;
  const B=r2(cards.reduce((s,a)=>s+linkedMonthly(a,m0),0));
  if(B<=0)return {noBudget:true,cards};
  const thisLeft=r2(cards.reduce((s,a)=>s+planLines(m0).filter(l=>l.payTo===a.id&&!l.paid).reduce((t,l)=>t+l.amount,0),0));
  const st=cards.map(a=>({a,n:nonBC(a),r:(a.rate||0)/1200,plans:(a.plans||[]).filter(p=>p.end&&p.end>=m0).map(p=>({monthly:p.monthly,end:p.end,from:p.from||m0})),settled:false,cleared:nonBC(a)<=0.005}));
  const remBC=(s,m)=>s.settled?0:r2(s.plans.reduce((t,p)=>t+p.monthly*Math.max(0,mDiff(m,p.end)),0));
  const dueBC=(s,m)=>s.settled?0:(m===m0?bcDue(s.a):r2(s.plans.filter(p=>p.end>=m&&p.from<=m).reduce((t,p)=>t+p.monthly,0)));
  let fund=0,m=m0,events=[],now=null,origEnd=m0;
  st.forEach(s=>s.plans.forEach(p=>{if(p.end>origEnd)origEnd=p.end}));
  for(let i=0;i<120;i++){
    if(i>0)st.forEach(s=>{if(s.n>0)s.n=r2(s.n*(1+s.r));});
    let avail=i===0?thisLeft:B;const pay={};st.forEach(s=>pay[s.a.id]=0);
    for(const s of st){const d=Math.min(avail,dueBC(s,m));pay[s.a.id]+=d;avail=r2(avail-d);const short=r2(dueBC(s,m)-d);if(short>0)s.n=r2(s.n+short);}
    for(const s of st){if(s.n<=0||avail<=0)continue;const mn=Math.min(s.n,Math.max(50,r2(s.n*0.05)));const d=Math.min(avail,mn);s.n=r2(s.n-d);pay[s.a.id]+=d;avail=r2(avail-d);}
    for(const s of st.slice().sort((x,y)=>(y.r-x.r)||(x.n-y.n))){if(s.n<=0||avail<=0)continue;const d=Math.min(avail,s.n);s.n=r2(s.n-d);pay[s.a.id]+=d;avail=r2(avail-d);}
    for(const s of st)if(!s.cleared&&s.n<=0.005){s.cleared=true;events.push({m,t:`Non-BC balance on ${s.a.name} fully paid`,k:"clear"});}
    const allClear=st.every(s=>s.n<=0.005);
    let saved=0;if(allClear&&avail>0){fund=r2(fund+avail);saved=avail;avail=0;}
    if(i===0)now={pay,saved:0,left:thisLeft};
    if(i===0&&allClear)now.saved=saved;
    for(const s of st.filter(s=>!s.settled&&remBC(s,m)>0).sort((x,y)=>remBC(x,m)-remBC(y,m))){const R=remBC(s,m);if(allClear&&fund>=R-0.005){fund=r2(fund-R);s.settled=true;events.push({m,t:`Settle ${s.a.name} BC early with about ${RM(R)} from your fund`,k:"settle",amt:R});}}
    const done=st.every(s=>s.n<=0.005&&(s.settled||remBC(s,m)<=0));
    if(done){events.push({m,t:"All card debt cleared",k:"done"});break;}
    m=addM(m,1);
  }
  const doneEv=events.find(e=>e.k==="done");
  return {B,thisLeft,now,events,doneM:doneEv?doneEv.m:null,origEnd,cards,fundMonthly:r2(B-cards.reduce((s,a)=>s+bcMonthly(a,m0),0))};
}

  for(const [k,kn] of DEBT_KINDS){
    const list=cr.filter(a=>a.kind===k);if(!list.length)continue;
    h+=`<div class="ghead"><h2>${kn}${list.length>1?"s":""}</h2></div>`;
    for(const a of list){
      const o=owed(a),mo=linkedMonthly(a),po=o>0?payoff(a):null,loan=isLoan(k);
      let rows="";
      if(loan){
        const p=(a.plans||[])[0];
        if(p&&p.end){const more=Math.max(0,mDiff(m,p.end));rows+=`<div class="kv"><span class="muted">Instalment</span><b>${fmt(p.monthly)}/month</b></div><div class="kv"><span class="muted">Payments left</span><b>${more+(bcDue(a)>0?1:0)}${p.total?` of ${p.total}`:""}</b></div><div class="kv"><span class="muted">Last payment</span><b style="font-family:var(--sys)">${mLabel(p.end)}</b></div>`;}
        else rows+=`<div class="kv"><span class="neg">Add the monthly instalment and which number you're on</span></div>`;
      }else{
        const n=nonBC(a);
        rows+=`<div class="kv"><span>${k==="card"?"Clear soon, charges interest":"Owed outside instalments"}</span><b class="${n>0&&a.rate?"neg":""}">${fmt(n)}</b></div>`;
        if(n>0&&a.rate)rows+=`<div class="kv"><span class="muted">Interest if not cleared</span><b>~${fmt(n*a.rate/1200)}/month</b></div>`;
        for(const p of (a.plans||[]).filter(p=>p.end&&p.end>=m)){const more=Math.max(0,mDiff(m,p.end));const num_=p.total?Math.max(1,p.total-more):null;
          rows+=`<div class="kv"><span>${esc(p.name||"BC")} <span class="muted small">${num_?`${num_} of ${p.total}`:"until "+mShort(p.end)}</span></span><b>${fmt(p.monthly)}/month</b></div><div class="kv" style="padding-top:0;border-bottom:.5px solid var(--line)"><span class="muted small">Left to pay, ends ${mLabel(p.end)}</span><span class="muted small num">${fmt(p.monthly*(more+(bcDue(a)>0?1:0)))}</span></div>`;}
      }
      let foot="";
      if(o<=0&&(loan?(a.plans||[]).length:true))foot=`<span class="chip ok">Fully paid</span>`;
      else if(!mo)foot=loan?"":`Add how much you pay each month to see when it'll be cleared.`;
      else if(po&&po.never)foot=`<span class="neg">At ${fmt(mo)} a month this keeps growing. Pay more than the interest and instalments.</span>`;
      else if(!loan&&hasPlan)foot="";
      else if(po)foot=`Paying ${fmt(mo)} a month, cleared by about ${mLabel(po.done)}${po.interest>1?`, around ${RM(po.interest)} in interest`:""}.`;
      h+=`<button class="group" data-act="${loan?"account":"debtview"}" data-id="${esc(a.id)}" style="display:block;width:100%;text-align:left;margin-bottom:10px"><div style="display:flex;gap:12px;align-items:center;padding:14px 16px 8px">${badgeHTML(a,true)}<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:17px">${esc(a.name)}</div><div class="small muted">${a.rate?a.rate+"% a year":"No interest"}</div></div><div style="text-align:right"><div class="num neg" style="font-size:20px;font-weight:700">${fmt(o)}</div><div class="small muted">total owed</div></div></div>${rows}${foot?`<div class="small muted" style="padding:10px 16px 14px">${foot}</div>`:""}</button>`;
    }
  }
  return h+`<div class="btns"><button class="btn" data-act="adddebt">Add a debt</button></div><p class="hint" style="text-align:center">Tap a card to see your payoff plan month by month. Spending on a card adds to “clear soon”. BC instalments are added each month by themselves.</p>`;
}

function cardSchedule(a,months){
  const r=(a.rate||0)/1200,start=thisYM();
  const linked=items().filter(i=>i.payTo===a.id);
  let nb=nonBC(a),rows=[];
  for(let k=0;k<months;k++){
    const m=addM(start,k);
    const lines=planLines(m).filter(l=>l.payTo===a.id);
    const paid=k===0&&lines.length&&lines.every(l=>l.paid);
    const pay=paid?0:r2(lines.filter(l=>!l.paid).reduce((s,l)=>s+l.amount,0));
    const bc=k===0?bcDue(a):bcMonthly(a,m);
    let interest=0;
    if(k>0&&nb>0){interest=r2(nb*r);nb=r2(nb+interest);}
    nb=r2(nb-(pay-bc));
    const bcLeft=r2((a.plans||[]).reduce((s,p)=>s+(p.end&&p.end>m?p.monthly*mDiff(m,p.end):0),0));
    rows.push({m,pay,bc,interest,nb,bcLeft,paid,editable:linked.length===1&&!paid,lineKey:lines[0]&&lines[0].key});
    if(nb<=0.005&&bcLeft<=0.005&&k>0)break;
  }
  return rows;
}
function sheetDebtView(id){
  const a=acc(id);if(!a)return;
  if(isLoan(a.kind))return sheetAccountForm(id);
  const rows=cardSchedule(a,36),m=thisYM();
  const clear=rows.find(r=>r.nb<=0.005),overpay=rows.find(r=>r.nb<-0.005);
  const linked=items().filter(i=>i.payTo===a.id&&itemActive(i,m));
  let h=`<div style="display:flex;gap:12px;align-items:center;margin:0 4px 14px">${badgeHTML(a,true)}<div style="flex:1"><div style="font-size:20px;font-weight:700">${esc(a.name)}</div><div class="small muted">${a.rate?a.rate+"% a year on the non-BC part":"No interest"}</div></div></div>`;
  h+=`<div class="group"><div class="pair"><div><div class="l">Non-BC now</div><div class="v ${nonBC(a)>0?"neg":""}">${fmt(nonBC(a))}</div></div><div><div class="l">BC left</div><div class="v">${fmt(unbilled(a)+bcDue(a))}</div></div></div></div>`;
  if(!linked.length)h+=`<p class="hint">Add how much you pay each month (Edit card details) to see your payoff plan.</p>`;
  else{
    h+=`<p class="hint">${clear&&nonBC(a)>0?`With this plan the non-BC part is cleared in <b>${mLabel(clear.m)}</b>.`:nonBC(a)<=0?"No non-BC balance. Payments go to your BC.":"At this plan the non-BC part isn't cleared within 3 years. Pay more in some months."}${overpay?` From ${mLabel(overpay.m)} you're paying more than needed, so you could lower the payment or save the extra to settle the BC early.`:""} Tap an amount to change what you'll pay that month.</p>`;
    h+=`<div class="ghead" style="margin-top:16px"><h2 style="font-size:17px">Month by month</h2></div><div class="group">`;
    h+=rows.map(r=>rowH({tag:"div",title:mLabel(r.m),sub:`BC ${fmt(r.bc)}${r.interest>0?`, interest ${fmt(r.interest)}`:""}, then non-BC ${r.nb>0?`<span class="neg">${fmt(r.nb)}</span>`:"cleared"}`,right:r.paid?`<span class="chip ok">Paid</span>`:r.editable?`<button class="paybtn num" data-dv="${r.m}">${fmt(r.pay)}</button>`:`<span class="amt">${fmt(r.pay)}</span>`})).join("");
    h+=`</div><p class="hint">Assumes no new spending on this card. New spending is added to non-BC when you record it.</p>`;
  }
  h+=`<div class="btns"><button class="btn ghost" id="dv-edit">Edit card details</button>${linked.length?"":""}</div>`;
  openSheet(h,sh=>{
    sh.querySelector("#dv-edit").onclick=()=>sheetAccountForm(id);
    sh.querySelectorAll("[data-dv]").forEach(b=>b.onclick=()=>{
      const mm=b.dataset.dv,it=linked[0],cur=findLine(mm,it.id);
      openSheet(`<h2>Pay ${esc(a.name)}</h2><p class="muted small" style="margin:-10px 4px 14px">${mLabel(mm)}</p><div class="field"><label>Amount you'll pay</label><input id="dv-a" class="big num" inputmode="decimal" value="${cur?cur.amount:amountFor(it,mm)}"></div><div class="toggle"><span>Also for the months after<small>Otherwise only ${MONTHS[+mm.slice(5)-1]} changes</small></span><span class="sw" id="dv-f"></span></div><div class="btns"><button class="btn" id="dv-ok">Save</button><button class="btn ghost" id="dv-back">Back</button></div>`,s2=>{
        bindSw(s2);
        s2.querySelector("#dv-back").onclick=()=>sheetDebtView(id);
        s2.querySelector("#dv-ok").onclick=()=>{const v=num(s2.querySelector("#dv-a").value);
          if(s2.querySelector("#dv-f").classList.contains("on")){it.amounts=(it.amounts||[]).filter(e=>e.from<mm);it.amounts.push({from:mm,amount:v});for(const k of Object.keys(D.months))if(k>=mm&&D.months[k].lines&&D.months[k].lines[it.id]&&!D.months[k].lines[it.id].paid)delete D.months[k].lines[it.id].amount;}
          else{const l=findLine(mm,it.id);if(l)setLine(mm,l,{amount:v});}
          commit();sheetDebtView(id);toast("Plan updated");};
      });
    });
  });
}

/* ===== record sheet ===== */
const R={};
function usage(type){const f={};for(const x of D.tx)if(x.type===type&&x.category)f[x.category.toLowerCase()]=(f[x.category.toLowerCase()]||0)+1;return f}
function openRec(type,id){

  Object.assign(R,{ex,type:ex?ex.type:(type||"expense"),amt:ex?String(r2(ex.amount)):"",cat:ex?ex.category||"":"",acc:ex?ex.account:defAcc(),to:ex?ex.toAccount||"":"",date:ex?ex.date:todayStr(),note:ex?ex.note||"":"",picking:null});
  if(R.type==="transfer"&&!R.to)R.to=(accounts().find(a=>a.id!==R.acc)||{}).id||"";

}
function closeRec(){$("#rec").classList.remove("on");}
function recAccountsFor(){return R.type==="expense"?accounts().filter(a=>isSpend(a)||(a.type==="debt"&&!isLoan(a.kind))):R.type==="income"?accounts().filter(a=>isSpend(a)||a.type==="savings"):accounts();}
function drawRec(){
  const el=$("#rec");el.dataset.t=R.type;
  const a=acc(R.acc),to=acc(R.to);
  const amtTxt=R.amt?R.amt:"0";
  const dateTxt=R.date===todayStr()?"Today":R.date===yestStr()?"Yesterday":dLabel(R.date);
  let body="";
  if(R.picking){
    const list=R.picking==="to"?accounts().filter(x=>x.id!==R.acc):recAccountsFor().filter(x=>R.type!=="transfer"||x.id!==R.to);
    body=`<div class="rec-lbl">${R.picking==="to"?"Move money to":R.type==="income"?"Money goes into":R.type==="transfer"?"Move money from":"Paid with"}</div><div class="rec-acc"><div class="group">${list.map(x=>rowH({data:`data-r="setacc" data-id="${esc(x.id)}"`,lead:badgeHTML(x),title:esc(x.name),sub:x.type==="debt"?"Owe "+fmt(owed(x)):fmt(accBalance(x)),right:(R.picking==="to"?R.to:R.acc)===x.id?`<span class="chev" style="color:var(--ink)">${ic("check")}</span>`:""})).join("")}${rowH({data:'data-r="newacc"',lead:icoHTML("plus","#8E8E93"),title:"Add an account"})}</div></div>`;
  }else if(R.type==="transfer"){
    body=`<div class="rec-lbl">Move money between accounts, pay off a card or loan, or put money into savings.</div><div class="rec-acc"><div class="group">${rowH({data:'data-r="pick" data-w="from"',lead:a?badgeHTML(a):icoHTML("wallet","#8E8E93"),title:a?esc(a.name):"Choose",sub:"From",chev:true})}${rowH({data:'data-r="pick" data-w="to"',lead:to?badgeHTML(to):icoHTML("wallet","#8E8E93"),title:to?esc(to.name):"Choose",sub:"To",chev:true})}</div></div>`;
  }else{
    const f=usage(R.type);
    const list=cats().filter(c=>c.type===R.type).slice().sort((x,y)=>(f[y.name.toLowerCase()]||0)-(f[x.name.toLowerCase()]||0));
    if(R.cat&&!list.some(c=>c.name===R.cat))list.unshift({name:R.cat,icon:catIcon(R.cat,R.type),type:R.type});
    body=`<div class="rec-cats">${list.map(c=>`<button class="cat ${c.name===R.cat?"on":""}" data-r="cat" data-n="${esc(c.name)}">${icoHTML(c.icon,catColor(c.name,R.type))}<span>${esc(c.name)}</span></button>`).join("")}<button class="cat" data-r="newcat">${icoHTML("plus","#C7C7CC")}<span>New</span></button></div>`;
  }
  const canSave=num(R.amt)>0&&(R.type==="transfer"?(R.acc&&R.to&&R.acc!==R.to):(R.cat&&R.acc));
  el.innerHTML=`<div class="rec-top"><button class="round" data-r="close" aria-label="Close">${ic("x")}</button><div class="seg">${[["expense","Spent"],["income","Received"],["transfer","Transfer"]].map(([v,n])=>`<button data-r="type" data-v="${v}" class="${R.type===v?"on":""}">${n}</button>`).join("")}</div></div>
  <div class="rec-amt"><div class="v num"><small>${CUR()}</small>${esc(amtTxt)}</div></div>
  <div class="rec-meta">${R.type!=="transfer"?`<button class="mchip" data-r="pick" data-w="acc">${a?badgeHTML(a):""}${a?esc(a.name):"Choose account"} <span class="muted" style="display:flex">${ic("chevron-right")}</span></button>`:""}<label class="mchip">${ic("calendar")} ${dateTxt}<input type="date" id="r-date" value="${R.date}"></label><button class="mchip ${R.noteOpen?"on":""}" data-r="note">${ic("pencil")} ${R.note?esc(R.note.slice(0,18)):"Note"}</button>${R.ex?`<button class="mchip" data-r="del" style="color:var(--out)">${ic("trash-2")} Delete</button>`:""}</div>
  ${R.noteOpen?`<div class="rec-note"><input id="r-note" placeholder="What was it for? (optional)" value="${esc(R.note)}"></div>`:""}
  ${body}
  <div class="keys">${["1","2","3","⌫","4","5","6","C","7","8","9","SAVE",".","0","00"].map(k=>k==="SAVE"?`<button class="save" data-r="save" ${canSave?"":"disabled"}>${R.ex?"Update":"Save"}</button>`:`<button class="${k==="⌫"||k==="C"?"act":""}" data-r="key" data-k="${k}" aria-label="${k==="⌫"?"Delete digit":k==="C"?"Clear":k}">${k==="⌫"?ic("delete"):k}</button>`).join("")}</div>`;
  const dt=el.querySelector("#r-date");if(dt)dt.onchange=()=>{R.date=dt.value||todayStr();drawRec();};
  const nt=el.querySelector("#r-note");if(nt){nt.oninput=()=>{R.note=nt.value};nt.onkeydown=e=>{if(e.key==="Enter"){R.noteOpen=false;drawRec();}};if(R.focusNote){R.focusNote=false;setTimeout(()=>nt.focus(),50);}}
}
function recKey(k){
  let s=R.amt;
  if(k==="00"){recKey("0");recKey("0");return;}
  if(k==="⌫")s=s.slice(0,-1);else if(k==="C")s="";
  else if(k==="."){if(!s.includes("."))s=(s||"0")+".";}
  else{if(s.includes(".")&&s.split(".")[1].length>=2)return;if(s==="0"&&k!==".")s="";s=(s+k).replace(/^0+(?=\d)/,"");if(s.replace(".","").length>9)return;}
  R.amt=s;drawRec();
}
function recSave(){
  const amt=num(R.amt);if(amt<=0)return;
  const ex=R.ex;
  const t={id:ex?ex.id:rid(),type:R.type,amount:amt,account:R.acc,date:R.date,note:(R.note||"").trim(),created:ex?ex.created||Date.now():Date.now()};
  if(R.type==="transfer"){t.toAccount=R.to;if(ex&&ex.category)t.category=ex.category;}else t.category=R.cat;
  for(const k of ["plan","src","goalId","withdraw"])if(ex&&ex[k]!=null&&ex.type===R.type)t[k]=ex[k];
  if(ex&&ex.type!==R.type)unlinkTx(ex);
  putTx(t);
  let linked=null;
  if(!ex){linked=t.type==="income"?autoLinkIncome(t):autoLink(t);}
  if(isSpend(acc(R.acc)))S().lastAccount=R.acc;
  commit();closeRec();
  const what=t.type==="transfer"?"Transfer":t.category;
  if(ex)toast("Updated");
  else toast(linked?`${esc(linked.name)} ticked off in your plan`:`${t.type==="income"?"+":t.type==="expense"?"−":""}${CUR()} ${fmt(amt)} ${what}`,"Undo",()=>{if(t.plan)unlinkTx(t);delTx(t.id);commit();});
}
$("#rec").addEventListener("click",e=>{
  const b=e.target.closest("[data-r]");if(!b)return;const r=b.dataset.r;
  if(r==="key")recKey(b.dataset.k);
  else if(r==="close"){if(R.picking){R.picking=null;drawRec();}else closeRec();}
  else if(r==="type"){R.type=b.dataset.v;R.cat="";R.picking=null;if(R.type==="transfer"&&(!R.to||R.to===R.acc))R.to=(accounts().find(a=>a.id!==R.acc)||{}).id||"";if(R.type!=="transfer"&&!recAccountsFor().some(a=>a.id===R.acc))R.acc=defAcc();drawRec();}
  else if(r==="cat"){R.cat=b.dataset.n;drawRec();}
  else if(r==="pick"){R.picking=b.dataset.w==="to"?"to":"acc";drawRec();}
  else if(r==="setacc"){if(R.picking==="to")R.to=b.dataset.id;else R.acc=b.dataset.id;R.picking=null;drawRec();}
  else if(r==="note"){R.noteOpen=!R.noteOpen;R.focusNote=R.noteOpen;drawRec();}
  else if(r==="save")recSave();
  else if(r==="newcat")sheetCat(null,R.type,true);
  else if(r==="newacc"){closeRec();sheetAddAccount();}
  else if(r==="del"){const ex=R.ex;closeRec();ask("Delete this record?",`${RM(ex.amount)}, ${esc(ex.category||"Transfer")}, ${dLabel(ex.date)}.${ex.plan?" It will also be un-ticked in your plan.":""}`,"Delete",()=>{unlinkTx(ex);delTx(ex.id);commit();toast("Deleted");},true);}
});

function removeAccount(a){

  ask("Remove "+esc(a.name)+"?","It has no records, so nothing else changes.","Remove",()=>{S().accounts=accounts().filter(z=>z.id!==a.id);items().forEach(i=>{if(i.payFrom===a.id)i.payFrom=null;if(i.payTo===a.id)i.end=thisYM();});goals().forEach(g=>{if(g.account===a.id)g.account=null});commit();},true);
}

function sheetPay(m,key){
  const l=findLine(m,key);if(!l)return;
  const def=m===thisYM()?todayStr():(m<thisYM()?m+"-28":todayStr());
  const to=l.payTo?acc(l.payTo):null;
  openSheet(`<h2>${l.goal?"Save for "+esc(l.goal.name):"Pay "+esc(l.name)}</h2>
  <div class="field"><label>Amount</label><input class="big num" id="p-amt" inputmode="decimal" value="${l.amount}"></div>
  <div class="two"><div class="field"><label>From</label><select id="p-acc">${accOptions(l.payFrom||defAcc(),a=>a.id!==l.payTo&&a.type!=="debt"||a.id===l.payFrom)}</select></div><div class="field"><label>Date</label><input type="date" id="p-date" value="${def}"></div></div>
  ${to?`<p class="hint" style="margin-top:-6px">Goes to ${esc(to.name)}${to.type==="debt"?", so you'll owe less":""}.</p>`:l.goal?`<p class="hint" style="margin-top:-6px">The money stays in your account, set aside for this goal.</p>`:""}
  <div class="toggle"><span>Record it<small>Turn off if you've already recorded this payment</small></span><span class="sw on" id="p-rec"></span></div>
  <button class="btn" id="p-ok">${l.goal?"Mark as saved":"Mark as paid"}</button>`,sh=>{
    bindSw(sh);
    sh.querySelector("#p-ok").onclick=()=>{
      const amt=num(sh.querySelector("#p-amt").value),date=sh.querySelector("#p-date").value||todayStr(),from=sh.querySelector("#p-acc").value,rec=sh.querySelector("#p-rec").classList.contains("on");

  <p class="hint" id="g-need" style="margin:-6px 0 12px"></p>
  <div class="field"><label>I'll save each month</label><input id="g-mo" class="num" inputmode="decimal" value="${g&&g.monthly||""}" ${g&&g.monthly?'data-touched="1"':""}></div>

    bindSw(sh);drawParts(sh);calc(sh);
    sh.querySelector("#gp-add").onclick=()=>{parts.push({name:"",amount:0});drawParts(sh);};
    ["#g-t","#g-m","#g-i"].forEach(s=>sh.querySelector(s).addEventListener("input",()=>calc(sh)));

  <p class="hint" style="margin-top:-6px">${g.account?`Moves money ${out?"out of":"into"} ${esc(acc(g.account).name)}.`:out?"The money becomes free to spend.":"The money stays in your account, set aside for this goal."}</p>
  <div class="btns"><button class="btn" id="gm-ok">${out?"Take out":"Add"}</button></div>`,sh=>{
    sh.querySelector("#gm-ok").onclick=()=>{const a=num(sh.querySelector("#gm-a").value);if(a<=0){toast("Enter an amount");return}goalTx(g,a,sh.querySelector("#gm-acc").value,sh.querySelector("#gm-d").value||todayStr(),out);commit();closeSheet();toast(out?"Taken out":"Added");};
  });
}
function sheetQuick(){
  const on=S().startOn==="spent";
  openSheet(`<h2>Quick record</h2>
  <div class="toggle"><span>Open straight to recording<small>When you open the app, the keypad is ready. Close it to see your home screen.</small></span><span class="sw ${on?"on":""}" id="q-sw"></span></div>
  <div class="day">Add it to your phone's home screen</div>
  <div class="group card-pad"><p style="margin:4px 0"><b>iPhone:</b> open this page in Safari, tap Share, then Add to Home Screen.</p><p style="margin:8px 0 4px"><b>Android:</b> tap ⋮ in Chrome, then Add to Home screen. Press and hold the icon for Spent and Received shortcuts.</p></div>`,sh=>{
    const s=sh.querySelector("#q-sw");s.onclick=()=>{s.classList.toggle("on");S().startOn=s.classList.contains("on")?"spent":"home";save();};
  });
}
function sheetCurrency(){openSheet(`<h2>Currency</h2><div class="field"><label>Shown before amounts</label><input id="c-v" value="${esc(CUR())}" placeholder="RM, S$, $"></div><button class="btn" id="c-ok">Save</button>`,sh=>{sh.querySelector("#c-ok").onclick=()=>{S().currency=sh.querySelector("#c-v").value.trim()||"RM";commit();closeSheet();};});}

/* ---------- backup ---------- */
function backup(){
  S().lastBackup=Date.now();save();
  const blob=new Blob([JSON.stringify({app:"earmark",v:3,exported:new Date().toISOString(),data:D})],{type:"application/json"});
  const name="earmark-backup-"+todayStr()+".json";let file=null;try{file=new File([blob],name,{type:"application/json"})}catch(_){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(()=>{});
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);}
  render();toast("Backup saved");
}
function restoreJson(json){
  const go=()=>{D=normalize(json.data);S().lastBackup=Date.now();save();UI.tab="home";UI.page=null;render();closeSheet();toast("Your records are loaded");};
  if(D&&(D.tx.length||items().length))ask("Replace everything?","This replaces all the records on this phone with the backup.","Replace",go,true);else go();
}
async function decodeSetup(code){
  code=String(code).trim().replace(/^.*#setup=/,"").replace(/\s+/g,"");const b64=code.replace(/-/g,"+").replace(/_/g,"/");
  const bin=Uint8Array.from(atob(b64+"===".slice((b64.length+3)%4)),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  const json=JSON.parse(txt);if(!json||!json.data||!json.data.settings)throw new Error("bad");return json;
}
function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c;}if(f||row.length){row.push(f);rows.push(row)}return rows;}
function importCSV(text){
  const rows=parseCSV(text.replace(/^﻿/,""));const hi=rows.findIndex(r=>r[0]==="Date"&&r.includes("Amount")&&r.includes("Type"));if(hi<0)return null;
  const H=rows[hi],ix=k=>H.indexOf(k),iD=ix("Date"),iC=ix("Category"),iA=ix("Amount"),iT=ix("Type"),iAc=ix("Account"),iN=ix("Note"),iTo=ix("Transfer to");
  const seen=new Set(D.tx.map(x=>x.src).filter(Boolean));
  const accFor=name=>{name=(name||"").trim()||"Imported";let a=accounts().find(x=>x.name.toLowerCase()===name.toLowerCase());if(!a){a={id:rid(),name,type:"bank",provider:"other",opening:0};accounts().push(a);}return a.id;};
  let added=0;
  for(const r of rows.slice(hi+1)){if(!r[iD]||!/^\d{4}-\d{2}-\d{2}/.test(r[iD]))continue;const type=(r[iT]||"").toLowerCase(),amt=num(r[iA]);if(!amt)continue;
    const src="mp|"+r[iD]+"|"+amt+"|"+type+"|"+r[iAc]+"|"+(iTo>=0?r[iTo]||"":"");if(seen.has(src))continue;seen.add(src);
    const t={id:rid(),date:r[iD].slice(0,10),created:Date.parse(r[iD].replace(" ","T"))||Date.now(),amount:Math.abs(amt),account:accFor(r[iAc]),note:iN>=0?(r[iN]||"").trim():"",src};
    if(type==="transfer"){t.type="transfer";t.toAccount=accFor(r[iTo]);}else{t.type=type==="income"?"income":"expense";t.category=(r[iC]||"Others").trim();ensureCat(t.category,t.type,"other");}
    D.tx.push(t);added++;}
  return added;
}
function handleFile(file){
  const rd=new FileReader();
  rd.onload=()=>{const text=String(rd.result);let json=null;try{json=JSON.parse(text)}catch(_){}
    if(json&&json.data&&json.data.settings){restoreJson(json);return;}
    if(!D)D=freshData();const n=importCSV(text);
    if(n==null){toast("That file isn't an Earmark backup");return}
    commit();closeSheet();toast(n+" records added");};
  rd.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.closest("#rec"))return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case "tab":UI.tab=ds.tab;UI.page=null;closeSheet();render();window.scrollTo(0,0);break;
    case "tabplan":UI.tab="plan";UI.page=null;render();window.scrollTo(0,0);break;
    case "page":UI.page=ds.p;closeSheet();render();window.scrollTo(0,0);break;
    case "back":UI.page=null;render();window.scrollTo(0,0);break;
    case "hide":S().hide=!S().hide;commit();break;
    case "close":closeSheet();break;
    case "start":D=freshData();commit();break;
    case "rec":closeSheet();openRec(ds.t||"expense");break;
    case "edittx":{const x=D.tx.find(t=>t.id===ds.id);if(!x)break;if(x.type==="save"){const g=goals().find(y=>y.id===x.goalId);ask(esc((x.withdraw?"Taken from ":"Saved for ")+(g?g.name:"goal")),`${RM(x.amount)} on ${dLabel(x.date)}.`,"Delete",()=>{unlinkTx(x);delTx(x.id);commit();},true);}else openRec(null,ds.id);break;}
    case "pm":UI.viewMonth=addM(UI.viewMonth||thisYM(),+ds.d);render();break;
    case "am":UI.actMonth=addM(UI.actMonth||thisYM(),+ds.d);render();break;
    case "rv":UI.recView=ds.v;render();break;
    case "filter":UI.filter=ds.v;render();break;
    case "pay":sheetPay(ds.m,ds.k);break;
    case "toggle":{const l=findLine(ds.m,ds.k);if(l)(l.paid?sheetUnpay:sheetPay)(ds.m,ds.k);break;}
    case "line":sheetLine(ds.m,ds.k);break;
    case "inctoggle":{const l=incomeLines(ds.m).find(x=>x.id===ds.k);if(!l)break;if(l.received)ask(esc(l.name),"Mark as not received? This deletes the record it made.","Mark as not received",()=>{if(l.txId)delTx(l.txId);setInc(ds.m,l.id,{received:null,txId:null});commit();},true);else sheetReceive(ds.m,ds.k);break;}
    case "incline":sheetIncLine(ds.m,ds.k);break;
    case "incomes":sheetIncomes();break;
    case "income":sheetIncome(ds.id||null);break;
    case "addplan":sheetAddPlan(ds.m||thisYM());break;
    case "items":sheetItems();break;
    case "item":sheetItem(ds.id);break;
    case "addacc":sheetAddAccount();break;
    case "adddebt":sheetAddAccount("debt");break;
    case "account":{const x=acc(ds.id);if(x)sheetAccountForm(x.id);break;}
    case "balances":sheetBalances();break;
    case "debtview":sheetDebtView(ds.id);break;
    case "cats":sheetCats("expense");break;
    case "cat":sheetCat(ds.n||null,ds.t);break;
    case "groups":sheetGroups();break;
    case "goal":goalDetail(ds.id);break;
    case "addgoal":sheetGoalForm(null);break;
    case "quick":sheetQuick();break;
    case "currency":sheetCurrency();break;
    case "backup":backup();break;
    case "import":$("#filein").value="";$("#filein").click();break;
    case "wipe":ask("Delete everything?","This removes all your records from this phone. Save a backup first if you might want them back.","Delete everything",()=>{try{localStorage.removeItem(KEY)}catch(_){}D=null;UI.tab="home";UI.page=null;render();},true);break;
  }
});
$("#filein").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f);});

/* ---------- boot ---------- */
D=load();if(D)normalize(D);
render();
const h=location.hash;
if(h.startsWith("#setup=")){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}decodeSetup(h).then(restoreJson).catch(()=>toast("That setup link didn't work"));}
else if(h==="#spent"||h==="#received"){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}openRec(h==="#spent"?"expense":"income");}
else if(D&&S().startOn==="spent")openRec("expense");
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
