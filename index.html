<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earmark — money tracker</title>
<meta name="description" content="Record money in and out in seconds, set aside money for bills, and track savings goals and debts. Your data stays on your phone.">
<meta name="theme-color" content="#5B3FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Earmark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5FA; --surface:#FFFFFF; --ink:#1A1F36; --muted:#6B7088; --faint:#A3A7BA; --line:#E6E8F0;
  --brand:#5B3FD6; --brand-2:#3E2AA8; --brand-soft:#ECE8FD;
  --in:#1F9D63; --in-soft:#E3F5EC; --out:#E0464E; --out-soft:#FDE9EA; --warn:#F08C00; --warn-soft:#FFF2DD;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0F1120; --surface:#191C2E; --ink:#EDEFF8; --muted:#9A9FB8; --faint:#62677F; --line:#272B40;
    --brand:#8E7BFF; --brand-2:#5B3FD6; --brand-soft:#26224A; --in:#3CC488; --in-soft:#173328; --out:#FF6B72; --out-soft:#3A1D22; --warn:#FFB443; --warn-soft:#3A2B14; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.d{font-family:var(--display);letter-spacing:-.02em}
.muted{color:var(--muted)} .small{font-size:13px} .pos{color:var(--in)} .neg{color:var(--out)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 110px)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.top h1{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0}
.top .back{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--brand)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* banknote */
.note{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#6A4FE6 0%,#4A2FC2 55%,#3A2399 100%);isolation:isolate}
.note::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;
  background:repeating-radial-gradient(circle at 100% 0%,transparent 0 9px,rgba(255,255,255,.55) 9px 10px),repeating-radial-gradient(circle at 0% 120%,transparent 0 13px,rgba(255,255,255,.35) 13px 14px);}
.note::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);box-shadow:0 0 0 14px rgba(255,255,255,.05),0 0 0 28px rgba(255,255,255,.04);z-index:-1}
.note .lbl{font-size:13.5px;font-weight:600;opacity:.85}
.note .big{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1.05;margin:4px 0 14px}
.note .big small{font-size:20px;font-weight:700;opacity:.8;margin-right:4px}
.note .row{display:flex;gap:10px;flex-wrap:wrap}
.note .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:baseline}
.note .pill b{font-family:var(--display);font-size:15px}
.note.low{background:linear-gradient(135deg,#E6545B 0%,#C0343C 60%,#9E2730 100%)}

/* record buttons */
.rec2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.rec2 button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r-md);font-weight:700;font-size:16px;text-align:left}
.rec2 .o{background:var(--out-soft);color:var(--out)} .rec2 .i{background:var(--in-soft);color:var(--in)}
.rec2 .sym{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;flex:none;line-height:1}
.rec2 .o .sym{background:var(--out)} .rec2 .i .sym{background:var(--in)}
.rec2 small{display:block;font-size:12.5px;font-weight:500;opacity:.8}

/* sections & lists */
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.sec-h h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h button,.sec-h a{color:var(--brand);font-weight:600;font-size:14px;text-decoration:none}
.panel{background:var(--surface);border-radius:var(--r-md);padding:2px 16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--display);font-weight:700;font-size:16.5px;white-space:nowrap;text-align:right}
.row .amt.in{color:var(--in)}
.row .chev{color:var(--faint);font-size:20px;line-height:1}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.02em;flex:none;font-family:var(--display)}
.badge.sm{width:30px;height:30px;border-radius:9px;font-size:10px}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:18px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthbar .m{font-family:var(--display);font-weight:700;font-size:20px}
.monthbar button{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:20px;color:var(--brand);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.bar.over i{background:var(--out)}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,50,.12)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--line);color:var(--muted);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.chip.ok{background:var(--in-soft);color:var(--in)} .chip.bad{background:var(--out-soft);color:var(--out)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.br{background:var(--brand-soft);color:var(--brand)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:14px;font-weight:800}
.tick.on{background:var(--in);border-color:var(--in);color:#fff}
.done .t,.done .amt{color:var(--faint)}
.paybtn{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13.5px;padding:7px 13px;border-radius:999px;white-space:nowrap}
.btn{display:block;width:100%;padding:15px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;text-align:center;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btns{display:grid;gap:10px;margin-top:14px}
.setup .row{cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
nav.tabs .plus{width:58px;height:58px;margin:-26px auto 0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(91,63,214,.45);border:4px solid var(--paper)}
nav.tabs .plus svg{width:28px;height:28px}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(15,17,40,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:35}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:36;max-height:92vh;overflow:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--display);margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--paper);outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.field .big{font-family:var(--display);font-size:28px;font-weight:800;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:600}
.toggle small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.sw{width:48px;height:29px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--brand)} .sw.on::after{transform:translateX(19px)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r-md);background:var(--paper);border:1.5px solid transparent;font-weight:600;font-size:13.5px;text-align:center}
.pick button.on{border-color:var(--brand);background:var(--brand-soft)}
.pick .e{font-size:26px;line-height:1}
.plist .row{cursor:pointer}
.search{width:100%;padding:12px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);margin-bottom:8px}
.mchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchips button{padding:9px 0;border-radius:10px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;font-size:13px}
.mchips button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.irow{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:6px}
.irow input{padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);width:100%}
.irow button{border-radius:10px;background:var(--out-soft);color:var(--out);font-weight:800}
.prow{display:grid;grid-template-columns:1fr 84px 110px 30px;gap:6px;margin-bottom:4px}
.prow input{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);width:100%;font-size:15px}
.prow button{border-radius:10px;background:var(--out-soft);color:var(--out);font-weight:800}
.linkbtn{color:var(--brand);font-weight:700;font-size:14px}

/* record sheet */
.rec{position:fixed;inset:0;margin:0 auto;max-width:520px;background:var(--surface);z-index:30;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top)}
.rec.on{transform:none}
.rec-top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.rec-top .seg{flex:1}
.rec-amt{text-align:center;padding:8px 16px 4px}
.rec-amt .v{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1.1}
.rec-amt .v small{font-size:22px;opacity:.6;margin-right:4px}
.rec[data-t=expense] .rec-amt .v{color:var(--out)} .rec[data-t=income] .rec-amt .v{color:var(--in)} .rec[data-t=transfer] .rec-amt .v{color:var(--brand)}
.rec-meta{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none}
.rec-meta::-webkit-scrollbar{display:none}
.mchip{position:relative;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:6px 12px 6px 6px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-weight:600;font-size:14px;flex:none}
.mchip.on{border-color:var(--brand);background:var(--brand-soft)}
.mchip.plain{padding:7px 12px}
.mchip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.rec-lbl{font-size:12.5px;font-weight:700;color:var(--muted);padding:2px 18px 0}
.rec-note{padding:0 16px 6px}
.rec-note input{width:100%;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper)}
.rec-cats{flex:1;overflow-y:auto;padding:6px 12px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start;border-top:1px solid var(--line)}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:16px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;border:2px solid transparent}
.cat .ico{width:44px;height:44px}
.cat.on{border-color:var(--brand);background:var(--brand-soft)}
.rec-acc{flex:1;overflow-y:auto;padding:6px 16px;border-top:1px solid var(--line)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--paper);border-top:1px solid var(--line)}
.keys button{height:52px;border-radius:14px;background:var(--surface);font-family:var(--display);font-size:24px;font-weight:600}
.keys .act{font-size:15px;font-family:var(--body);font-weight:700;color:var(--muted)}
.keys .save{grid-row:span 2;height:auto;background:var(--brand);color:#fff;font-family:var(--body);font-size:17px;font-weight:700}
.keys .save:disabled{opacity:.4}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);padding:11px 14px 11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:all .22s;z-index:50;pointer-events:none;max-width:92vw;display:flex;gap:14px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--brand-soft);font-weight:800}
@media (prefers-color-scheme: dark){#toast button{color:var(--brand-2)}}

/* welcome */
.welcome{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;padding:20px 4px}
.welcome .note{margin-bottom:26px}
.welcome h1{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0 0 22px;font-size:16.5px;max-width:34ch}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:24px 0 4px}
.goal-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:72px;margin-top:8px}
.hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);font-weight:600}
.hist i{display:block;width:70%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px}
.hist i.miss{background:var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14.5px}
.kv b{font-family:var(--display);font-weight:700}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:11px;font-weight:700;font-size:16px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Records</button>
  <button data-act="rec" data-t="expense" aria-label="Record"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>Plan</button>
  <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>More</button>
</div></nav>
<div id="scrim" data-act="close"></div>
<div class="sheet" id="sheet"></div>
<div class="rec" id="rec"></div>
<div id="toast"></div>
<input type="file" id="filein" accept=".json,application/json,.csv,text/csv" hidden>

<script>
/* ===== Settings you can change ===== */
const CONFIG = {
  appName: "Earmark",
  supportUrl: "",            // e.g. "https://ko-fi.com/yourname" — leave "" to hide the Support button
  supportLabel: "Buy me a coffee",
  madeBy: "@nurulkhairida_",
  madeByUrl: "https://www.instagram.com/nurulkhairida_/",
  currency: "RM"
};
</script>
<script>
(function(){
"use strict";
const KEY="earmark:v1";
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const SPEND=new Set(["bank","ewallet","cash"]);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>r2(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(+n||0).toLocaleString("en-MY");
const CUR=()=>(D&&D.settings.currency)||CONFIG.currency;
const RM=n=>(r2(n)<0?"−":"")+CUR()+" "+fmt(Math.abs(n));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>dstr(new Date());
const yestStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const ymOf=d=>String(d).slice(0,7);
const thisYM=()=>ymOf(todayStr());
function addM(ym,k){let [y,m]=ym.split("-").map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m);}
function mDiff(a,b){const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return (yb-ya)*12+(mb-ma);}
const mLabel=ym=>{const [y,m]=ym.split("-");return MONTHS[+m-1]+" "+y};
const mLong=ym=>{const [y,m]=ym.split("-");return new Date(+y,+m-1,1).toLocaleString("en-MY",{month:"long"})+(y===thisYM().slice(0,4)?"":" "+y)};
const mShort=ym=>{const [y,m]=ym.split("-");return MONTHS[+m-1]+" ’"+y.slice(2);};
const dLabel=d=>{const [y,m,dd]=d.split("-");return (+dd)+" "+MONTHS[+m-1];};
function dayLabel(d){if(d===todayStr())return "Today";if(d===yestStr())return "Yesterday";const [y,m,dd]=d.split("-").map(Number);return WD[new Date(y,m-1,dd).getDay()]+", "+dd+" "+MONTHS[m-1];}
function ord(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function num(v){const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?r2(n):0;}
function toast(msg,label,fn){const t=$("#toast");t.innerHTML=`<span>${esc(msg)}</span>${label?`<button id="toast-a">${esc(label)}</button>`:""}`;t.classList.add("on");if(label)$("#toast-a").onclick=()=>{t.classList.remove("on");fn();};clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),label?4500:2400);}
function lum(hex){const h=hex.replace("#","");const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return .2126*r+.7152*g+.0722*b}

/* ---------- storage ---------- */
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast("Couldn't save — your phone's storage may be full");}}
function commit(){save();render();}
function freshData(){return normalize({v:3,settings:{currency:CONFIG.currency,lastBackup:null,accounts:[{id:"cash",name:"Cash",type:"cash",provider:"cash",opening:0}],items:[],incomes:[],goals:[]},months:{},tx:[]});}
function normalize(d){
  d.settings=d.settings||{};const s=d.settings;
  if(!s.groups||!s.groups.length)s.groups=GROUPS.map(([id,name])=>({id,name}));
  if(!s.categories)s.categories=[...DEF_EXP.map(([name,group,icon])=>({name,type:"expense",group,icon})),...DEF_INC.map(([name,icon])=>({name,type:"income",icon}))];
  for(const c of s.categories)if(!c.icon){const e=[...DEF_EXP,...DEF_INC.map(x=>[x[0],null,x[1]])].find(x=>x[0].toLowerCase()===c.name.toLowerCase());c.icon=e?e[2]:"🏷️";}
  s.accounts=s.accounts||[];s.items=s.items||[];s.goals=s.goals||[];s.incomes=s.incomes||[];
  if(s.currency==null)s.currency=CONFIG.currency;
  d.months=d.months||{};d.tx=d.tx||[];
  for(const a of s.accounts){
    if(a.type==="credit"){a.type="debt";a.kind=a.kind==="paylater"?"bnpl":a.kind==="loan"?"personal":(a.kind||"card");}
    if(a.type==="debt"){a.plans=a.plans||[];if(a.rate==null)a.rate=a.kind==="card"?18:0;}
    if(!a.provider){const p=ALLP.find(p=>p[1].toLowerCase()===a.name.toLowerCase()||p[3].toLowerCase()===a.name.toLowerCase());a.provider=p?p[0]:(a.type==="cash"?"cash":"other");}
  }
  delete s.defaultIncome;
  return d;
}

/* ---------- model ---------- */
const S=()=>D.settings;
const items=()=>S().items, accounts=()=>S().accounts, groups=()=>S().groups, goals=()=>S().goals, incomes=()=>S().incomes, cats=()=>S().categories;
const acc=id=>accounts().find(a=>a.id===id);
const isSpend=a=>!!a&&SPEND.has(a.type);
const itemActive=(t,m)=>(!t.start||t.start<=m)&&(!t.end||m<t.end);
function amountFor(t,m){let a=0;const l=(t.amounts||[]).slice().sort((x,y)=>x.from<y.from?-1:1);for(const e of l)if(e.from<=m)a=e.amount;return a}
const monthDoc=m=>D.months[m]||{};
const groupName=id=>{const g=groups().find(g=>g.id===id);return g?g.name:(id==="oneoff"?"One-off":"Others")};
const groupColor=id=>{const g=GROUPS.find(g=>g[0]===id);if(g)return g[2];const i=groups().findIndex(g=>g.id===id);return ["#0B7285","#C2255C","#5F3DC4","#E67700"][Math.max(0,i)%4]};
function catOf(name,type){return cats().find(c=>c.type===type&&c.name.toLowerCase()===String(name||"").toLowerCase())}
function catGroup(name){const c=catOf(name,"expense");return c&&c.group?c.group:"other";}
function catIcon(name,type){const c=catOf(name,type);return c?c.icon:(type==="income"?"💰":"🏷️")}
function catColor(name,type){return type==="income"?"#1F9D63":groupColor(catGroup(name))}
function icoHTML(icon,color){return `<span class="ico" style="background:${color}1f">${icon}</span>`}
function prov(a){const p=ALLP.find(p=>p[0]===a.provider&&(providersFor(a.type,a.kind).some(x=>x[0]===a.provider)));return p||["other",a.name,"#6B7088",null]}
function badgeHTML(a,sm){const p=prov(a);const short=(p[0]==="other"||!p[3])?(a.name.split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase()||"?"):p[3];const fg=lum(p[2])>.6?"#1A1F36":"#fff";return `<span class="badge ${sm?"sm":""}" style="background:${p[2]};color:${fg}">${esc(short)}</span>`}
function spentOn(m,cat){const n=String(cat).toLowerCase();return r2(D.tx.filter(x=>x.type==="expense"&&ymOf(x.date)===m&&String(x.category||"").toLowerCase()===n&&!x.plan).reduce((a,x)=>a+x.amount,0))}

const incomeActive=(s,m)=>itemActive(s,m)&&(s.freq!=="custom"||(s.months||[]).includes(+m.slice(5)));
function incomeLines(m){const d=monthDoc(m).incomes||{};return incomes().filter(s=>incomeActive(s,m)).map(s=>{const o=d[s.id]||{};return o.skip?null:{key:"i:"+s.id,id:s.id,name:s.name,amount:o.amount!=null?o.amount:amountFor(s,m),received:!!o.received,txId:o.txId||null,category:s.category||s.name,account:s.account||null,freq:s.freq}}).filter(Boolean);}
const incomeTotal=m=>r2(incomeLines(m).reduce((s,l)=>s+l.amount,0));

function goalSaved(g){return r2((g.initial||0)+D.tx.filter(x=>x.goalId===g.id).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0))}
const goalTarget=g=>g.parts&&g.parts.length?r2(g.parts.reduce((s,p)=>s+(+p.amount||0),0)):(g.target||0);
const goalMonthsLeft=g=>g.targetMonth?Math.max(1,mDiff(thisYM(),g.targetMonth)+1):null;
function goalNeeded(g){const left=Math.max(0,goalTarget(g)-goalSaved(g)),n=goalMonthsLeft(g);if(!n)return null;const paidThis=planLines(thisYM()).some(l=>l.key==="g:"+g.id&&l.paid);return r2(left/(paidThis?Math.max(1,n-1):n));}
const goalSavedIn=(g,m)=>r2(D.tx.filter(x=>x.goalId===g.id&&ymOf(x.date)===m).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0));
const earmarkedGoals=()=>r2(goals().filter(g=>!g.account).reduce((s,g)=>s+Math.max(0,goalSaved(g)),0));

function planLines(m){
  const d=monthDoc(m),out=[],L=d.lines||{};
  for(const t of items()){
    if(!itemActive(t,m))continue;const l=L[t.id]||{};if(l.skip)continue;
    const o={key:t.id,id:t.id,name:t.name,group:t.group,kind:t.kind||"fixed",amount:l.amount!=null?l.amount:amountFor(t,m),paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:l.dueDay||t.dueDay||null,note:t.note||"",category:t.category||t.name,payFrom:t.payFrom||null,payTo:t.payTo||null};
    if(o.kind==="budget")o.spent=spentOn(m,o.category);out.push(o);
  }
  for(const g of goals()){
    if(g.done||!g.inPlan||!(g.monthly>0))continue;if((g.start&&m<g.start)||(g.targetMonth&&m>g.targetMonth))continue;
    const l=L["g:"+g.id]||{};if(l.skip)continue;
    out.push({key:"g:"+g.id,id:g.id,goal:g,name:"Save for "+g.name,group:"_goals",kind:"fixed",amount:l.amount!=null?l.amount:g.monthly,paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:g.dueDay||null,note:"",category:"Savings",payFrom:null,payTo:g.account||null});
  }
  for(const x of (d.extras||[]))out.push({key:"x:"+x.id,id:x.id,name:x.name,group:x.group||"oneoff",kind:"fixed",amount:x.amount,paid:!!x.paid,paidOn:x.paidOn||null,txId:x.txId||null,dueDay:x.dueDay||null,note:x.note||"",category:x.category||x.name,payFrom:null,payTo:null,extra:true});
  return out;
}
const fromCash=l=>!l.payFrom||isSpend(acc(l.payFrom));
function lineReserved(l){if(!fromCash(l))return 0;if(l.kind==="budget")return l.paid?0:Math.max(0,r2(l.amount-l.spent));return l.paid?0:l.amount;}
const findLine=(m,key)=>planLines(m).find(l=>l.key===key);
function dueText(l,m){if(!l.dueDay)return null;const due=m+"-"+pad(l.dueDay),late=!l.paid&&m===thisYM()&&todayStr()>due;return {txt:late?"Overdue, was due "+ord(l.dueDay):"Due "+ord(l.dueDay),late};}

function billedCount(p,upto){if(!p.from||!p.end)return 0;const end=p.end&&p.end<upto?p.end:upto;return Math.max(0,mDiff(p.from,end)+1)}
function accBalance(a){
  let b=a.opening||0;
  for(const x of D.tx){
    if(x.type==="income"&&x.account===a.id)b+=x.amount;
    else if(x.type==="expense"&&x.account===a.id)b-=x.amount;
    else if(x.type==="transfer"){if(x.account===a.id)b-=x.amount;if(x.toAccount===a.id)b+=x.amount;}
  }
  if(a.type==="debt")for(const p of a.plans||[])b-=p.monthly*billedCount(p,thisYM());
  return r2(b);
}
const cashTotal=()=>r2(accounts().filter(isSpend).reduce((s,a)=>s+accBalance(a),0));
const stmtOwed=a=>r2(Math.max(0,-accBalance(a)));
function unbilled(a){const m=thisYM();return r2((a.plans||[]).reduce((s,p)=>s+p.monthly*Math.max(0,p.end?mDiff(m,p.end):0),0))}
const owed=a=>r2(stmtOwed(a)+unbilled(a));
const totalDebt=()=>r2(accounts().filter(a=>a.type==="debt").reduce((s,a)=>s+owed(a),0));
function linkedMonthly(a,m){m=m||thisYM();return r2(items().filter(i=>i.payTo===a.id&&itemActive(i,m)).reduce((s,i)=>s+amountFor(i,m),0))}
function payoff(a){
  const P=linkedMonthly(a);let bal=stmtOwed(a);const r=(a.rate||0)/1200;let m=thisYM(),interest=0,n=0;
  if(!P)return null;
  const paidNow=planLines(m).filter(l=>l.payTo===a.id).every(l=>l.paid);
  if(!paidNow)bal-=P;
  while(n<480){
    if(bal<=0.005&&!(a.plans||[]).some(p=>p.end&&p.end>m))break;
    n++;m=addM(m,1);
    if(bal>0){const i=bal*r;interest+=i;bal+=i;}
    for(const p of a.plans||[])if(p.end&&p.end>=m&&(!p.from||p.from<=m))bal+=p.monthly;
    bal-=P;
    if(n>12&&bal>owed(a)+1)return {never:true};
  }
  if(n>=480)return {never:true};
  return {months:n,done:m,interest:r2(interest)};
}
function defAcc(){const id=S().lastAccount;if(id&&isSpend(acc(id)))return id;const a=accounts().find(a=>a.type==="bank")||accounts().find(isSpend)||accounts()[0];return a?a.id:""}
function safeToSpend(){
  const m=thisYM(),lines=planLines(m);
  const planned=r2(lines.filter(l=>l.kind!=="budget").reduce((t,l)=>t+lineReserved(l),0));
  const budgets=r2(lines.filter(l=>l.kind==="budget").reduce((t,l)=>t+lineReserved(l),0));
  const goalsHeld=earmarkedGoals();
  return {cash:cashTotal(),planned,budgets,goalsHeld,safe:r2(cashTotal()-planned-budgets-goalsHeld)};
}

/* ---------- mutations ---------- */
function mutMonth(m,fn){D.months[m]=D.months[m]||{};fn(D.months[m]);}
function setLine(m,l,patch){mutMonth(m,d=>{if(l.extra){d.extras=(d.extras||[]).map(x=>x.id===l.id?Object.assign(x,patch):x);}else{d.lines=d.lines||{};const o=Object.assign(d.lines[l.key]||{},patch);for(const k in o)if(o[k]===null||o[k]===undefined)delete o[k];d.lines[l.key]=o;}});}
function setInc(m,id,patch){mutMonth(m,d=>{d.incomes=d.incomes||{};const o=Object.assign(d.incomes[id]||{},patch);for(const k in o)if(o[k]===null||o[k]===undefined)delete o[k];d.incomes[id]=o;});}
const delTx=id=>{D.tx=D.tx.filter(x=>x.id!==id)};
function putTx(t){const i=D.tx.findIndex(x=>x.id===t.id);if(i>=0)D.tx[i]=t;else D.tx.push(t);}
function ensureCat(name,type,group,icon){if(!name)return;if(!catOf(name,type))cats().push(type==="income"?{name,type,icon:icon||"💰"}:{name,type,group:group||"other",icon:icon||"🏷️"});}
function goalTx(g,amt,from,date,withdraw,extra){
  const t=Object.assign({id:rid(),amount:amt,date,goalId:g.id,created:Date.now(),category:g.name,note:""},extra||{});
  if(withdraw)t.withdraw=true;
  if(extra&&extra.type==="save"){t.type="save";t.account=from;}
  else if(g.account){t.type="transfer";if(withdraw){t.account=g.account;t.toAccount=from}else{t.account=from;t.toAccount=g.account}}
  else{t.type="save";t.account=from;}
  putTx(t);return t.id;
}
/* when a recording matches an unpaid planned payment, tick it off */
function autoLink(t){
  if(t.plan||t.goalId)return null;
  const m=ymOf(t.date);

  const short=gs.filter(g=>!g.targetMonth||mDiff(thisYM(),g.targetMonth)<12),long=gs.filter(g=>g.targetMonth&&mDiff(thisYM(),g.targetMonth)>=12);
  let h=top("Savings goals",{back:"More"});
  h+=`<div class="duo"><div class="stat"><div class="l">Saved so far</div><div class="v num pos">${fmt(goals().reduce((s,g)=>s+goalSaved(g),0))}</div></div><div class="stat"><div class="l">Saving each month</div><div class="v num">${fmt(gs.filter(g=>g.inPlan).reduce((s,g)=>s+(g.monthly||0),0))}</div></div></div>`;
  if(!gs.length)h+=`<div class="sec panel"><div class="empty"><b>No goals yet</b>Pick a goal and a date. ${esc(CONFIG.appName)} works out how much to save each month and reminds you in your plan.</div></div>`;
  const card=g=>{
    const t=goalTarget(g),sv=goalSaved(g),pct=t>0?Math.min(100,sv/t*100):0,need=goalNeeded(g),ml=goalMonthsLeft(g);
    let chip="";if(t<=0)chip='<span class="chip warn">Set a budget</span>';else if(sv>=t)chip='<span class="chip ok">Reached</span>';else if(need!=null&&g.inPlan&&g.monthly>=need-0.5)chip='<span class="chip ok">On track</span>';else if(need!=null)chip='<span class="chip bad">Behind</span>';
    return `<button class="panel" data-act="goal" data-id="${esc(g.id)}" style="display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px"><div class="goal-h"><div><div style="font-weight:700;font-size:16.5px">${esc(g.name)}</div><div class="s small muted">${g.targetMonth?"By "+mLabel(g.targetMonth)+", "+ml+" month"+(ml>1?"s":"")+" left":"No date set"}</div></div>${chip}</div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-top:10px"><span class="d num" style="font-size:24px;font-weight:800">${CUR()} ${fmt0(sv)}</span><span class="muted num">of ${fmt0(t)}</span></div><div class="bar"><i style="width:${pct}%;background:var(--in)"></i></div>
    <div class="small muted" style="margin-top:6px">${need!=null&&t>sv?`Needs ${RM(need)} a month`:""}${g.inPlan&&g.monthly?`${need!=null&&t>sv?", ":""}you plan ${RM(g.monthly)}`:""}</div></button>`;
  };
  if(short.length)h+=`<div class="sec"><div class="sec-h"><h2>Within a year</h2></div>${short.map(card).join("")}</div>`;
  if(long.length)h+=`<div class="sec"><div class="sec-h"><h2>Longer term</h2></div>${long.map(card).join("")}</div>`;
  const done=goals().filter(g=>g.done);
  if(done.length)h+=`<div class="sec"><div class="sec-h"><h2>Completed</h2></div><div class="panel">${done.map(g=>`<button class="row" data-act="goal" data-id="${esc(g.id)}">${icoHTML("🏁","#1F9D63")}<div class="main"><div class="t">${esc(g.name)}</div></div><div class="amt num">${fmt0(goalSaved(g))}</div></button>`).join("")}</div></div>`;
  return h+`<div class="btns"><button class="btn" data-act="addgoal">New goal</button></div>`;
}
function vDebts(){
  const cr=accounts().filter(a=>a.type==="debt");
  let h=top("Debts",{back:"More"});
  h+=`<div class="duo"><div class="stat"><div class="l">Total owed</div><div class="v num neg">${fmt(totalDebt())}</div></div><div class="stat"><div class="l">Paying each month</div><div class="v num">${fmt(cr.reduce((s,a)=>s+linkedMonthly(a),0))}</div></div></div>`;
  if(!cr.length)h+=`<div class="sec panel"><div class="empty"><b>No debts added</b>Add credit cards, PayLater and loans to see how much you owe and when it'll be cleared.</div></div>`;
  for(const [k,kn] of DEBT_KINDS){
    const list=cr.filter(a=>a.kind===k);if(!list.length)continue;
    h+=`<div class="sec"><div class="sec-h"><h2>${kn}${list.length>1?"s":""}</h2></div>`;
    for(const a of list){
      const st=stmtOwed(a),ub=unbilled(a),o=st+ub,mo=linkedMonthly(a),po=o>0?payoff(a):null;
      let rows="";
      if(ub>0)rows+=`<div class="kv"><span class="muted">${isLoan(k)?"Due now":"Balance"}</span><b class="num">${fmt(st)}</b></div><div class="kv"><span class="muted">${isLoan(k)?"Instalments left":"Instalments (BC/EPP)"}</span><b class="num">${fmt(ub)}</b></div>`;
      if(a.rate>0&&st>0&&!isLoan(k))rows+=`<div class="kv"><span class="muted">Interest if not paid in full</span><b class="num">~${fmt(st*a.rate/1200)} a month</b></div>`;
      let foot="";
      if(o<=0)foot=`<span class="chip ok">Fully paid</span>`;
      else if(!mo)foot=`<span class="small muted">Add a monthly payment to see when it'll be cleared.</span>`;
      else if(po&&po.never)foot=`<span class="small neg">At ${fmt(mo)} a month this keeps growing. Pay more than the interest and instalments.</span>`;
      else if(po)foot=`<span class="small muted">Paying ${fmt(mo)} a month, cleared by about ${mLabel(po.done)}${po.interest>1?`, around ${RM(po.interest)} in interest`:""}.</span>`;
      h+=`<button class="panel" data-act="account" data-id="${esc(a.id)}" style="display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px"><div style="display:flex;gap:12px;align-items:center">${badgeHTML(a)}<div style="flex:1;min-width:0"><div style="font-weight:700">${esc(a.name)}</div><div class="small muted">${a.rate?a.rate+"% a year":"No interest"}</div></div><div style="text-align:right"><div class="d num neg" style="font-size:20px;font-weight:800">${fmt(o)}</div><div class="small muted">owed</div></div></div>${rows?`<div style="margin-top:8px">${rows}</div>`:""}<div style="margin-top:8px">${foot}</div></button>`;
    }
    h+=`</div>`;
  }
  return h+`<div class="btns"><button class="btn" data-act="adddebt">Add a debt</button></div><p class="hint" style="text-align:center">Spending on a card or PayLater adds to what you owe. Instalments are added each month. Interest is an estimate, so update the balance from your statement now and then.</p>`;
}

/* ---------- sheets ---------- */
function openSheet(html,mount){const sh=$("#sheet");sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=0;sh.classList.add("on");$("#scrim").classList.add("on");if(mount)mount(sh);}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");}
function accOptions(sel,filter){return accounts().filter(filter||(()=>true)).map(a=>`<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${esc(a.name)}</option>`).join("")}
function groupOptions(sel,withOneoff){return (withOneoff?[{id:"oneoff",name:"One-off"}]:[]).concat(groups()).map(g=>`<option value="${esc(g.id)}" ${g.id===sel?"selected":""}>${esc(g.name)}</option>`).join("")}
function bindSw(sh){sh.querySelectorAll(".sw").forEach(s=>s.addEventListener("click",()=>s.classList.toggle("on")));}
function ask(title,msg,okLabel,fn,danger){openSheet(`<h2>${title}</h2><p class="muted" style="margin-top:-6px">${msg}</p><div class="btns"><button class="btn ${danger?"danger":""}" id="q-ok">${okLabel}</button><button class="btn ghost" data-act="close">Cancel</button></div>`,sh=>{sh.querySelector("#q-ok").onclick=()=>{closeSheet();fn();};});}

/* ===== record sheet ===== */
const R={};
function usage(type){const f={};for(const x of D.tx)if(x.type===type&&x.category)f[x.category.toLowerCase()]=(f[x.category.toLowerCase()]||0)+1;return f}
function openRec(type,id){
  if(!D){D=freshData();save();}
  const ex=id?D.tx.find(x=>x.id===id):null;
  Object.assign(R,{ex,type:ex?ex.type:(type||"expense"),amt:ex?String(r2(ex.amount)):"",cat:ex?ex.category||"":"",acc:ex?ex.account:defAcc(),to:ex?ex.toAccount||"":"",date:ex?ex.date:todayStr(),note:ex?ex.note||"":"",picking:null});
  if(R.type==="transfer"&&!R.to)R.to=(accounts().find(a=>a.id!==R.acc)||{}).id||"";
  drawRec();$("#rec").classList.add("on");
}
function closeRec(){$("#rec").classList.remove("on");}
function recAccountsFor(){return R.type==="expense"?accounts().filter(a=>isSpend(a)||(a.type==="debt"&&!isLoan(a.kind))):R.type==="income"?accounts().filter(a=>isSpend(a)||a.type==="savings"):accounts();}
function drawRec(){
  const el=$("#rec");el.dataset.t=R.type;
  const a=acc(R.acc),to=acc(R.to);
  const amtTxt=R.amt?R.amt:"0";
  const dateTxt=R.date===todayStr()?"Today":R.date===yestStr()?"Yesterday":dLabel(R.date);
  let body="";
  if(R.picking){
    const list=R.picking==="to"?accounts().filter(x=>x.id!==R.acc):recAccountsFor().filter(x=>R.type!=="transfer"||x.id!==R.to);
    body=`<div class="rec-lbl">${R.picking==="to"?"Move money to":R.type==="income"?"Money goes into":R.type==="transfer"?"Move money from":"Paid with"}</div><div class="rec-acc">${list.map(x=>`<button class="row" data-r="setacc" data-id="${esc(x.id)}">${badgeHTML(x)}<div class="main"><div class="t">${esc(x.name)}</div><div class="s">${x.type==="debt"?"Owe "+fmt(owed(x)):fmt(accBalance(x))}</div></div>${(R.picking==="to"?R.to:R.acc)===x.id?'<span class="chip br">Selected</span>':""}</button>`).join("")}<button class="row" data-r="newacc">${icoHTML("＋","#5B3FD6")}<div class="main"><div class="t">Add an account</div></div></button></div>`;
  }else if(R.type==="transfer"){
    body=`<div class="rec-lbl">Moving money between your accounts, paying a card or loan, or saving.</div><div class="rec-acc"><button class="row" data-r="pick" data-w="from">${a?badgeHTML(a):icoHTML("?","#868E96")}<div class="main"><div class="s">From</div><div class="t">${a?esc(a.name):"Choose"}</div></div><span class="chev">›</span></button><button class="row" data-r="pick" data-w="to">${to?badgeHTML(to):icoHTML("?","#868E96")}<div class="main"><div class="s">To</div><div class="t">${to?esc(to.name):"Choose"}</div></div><span class="chev">›</span></button></div>`;
  }else{
    const f=usage(R.type);
    const list=cats().filter(c=>c.type===R.type).slice().sort((x,y)=>(f[y.name.toLowerCase()]||0)-(f[x.name.toLowerCase()]||0));
    if(R.cat&&!list.some(c=>c.name===R.cat))list.unshift({name:R.cat,icon:catIcon(R.cat,R.type),type:R.type});
    body=`<div class="rec-cats">${list.map(c=>`<button class="cat ${c.name===R.cat?"on":""}" data-r="cat" data-n="${esc(c.name)}">${icoHTML(c.icon,catColor(c.name,R.type))}<span>${esc(c.name)}</span></button>`).join("")}<button class="cat" data-r="newcat">${icoHTML("＋","#868E96")}<span>New</span></button></div>`;
  }
  const canSave=num(R.amt)>0&&(R.type==="transfer"?(R.acc&&R.to&&R.acc!==R.to):(R.cat&&R.acc));
  el.innerHTML=`<div class="rec-top"><button class="iconbtn" data-r="close" aria-label="Close">✕</button><div class="seg">${[["expense","Spent"],["income","Received"],["transfer","Transfer"]].map(([v,n])=>`<button data-r="type" data-v="${v}" class="${R.type===v?"on":""}">${n}</button>`).join("")}</div></div>
  <div class="rec-amt"><div class="v num"><small>${CUR()}</small>${esc(amtTxt)}</div></div>
  <div class="rec-meta">${R.type!=="transfer"?`<button class="mchip" data-r="pick" data-w="acc">${a?badgeHTML(a,true):""}${a?esc(a.name):"Choose account"} ▾</button>`:""}<label class="mchip plain">📅 ${dateTxt}<input type="date" id="r-date" value="${R.date}"></label><button class="mchip plain ${R.noteOpen||R.note?"on":""}" data-r="note">✎ ${R.note?esc(R.note.slice(0,18)):"Note"}</button>${R.ex?`<button class="mchip plain" data-r="del" style="color:var(--out)">Delete</button>`:""}</div>
  ${R.noteOpen?`<div class="rec-note"><input id="r-note" placeholder="What was it for? (optional)" value="${esc(R.note)}"></div>`:""}
  ${body}
  <div class="keys">${["1","2","3","⌫","4","5","6","C","7","8","9","SAVE",".","0","00"].map(k=>k==="SAVE"?`<button class="save" data-r="save" ${canSave?"":"disabled"}>${R.ex?"Update":"Save"}</button>`:`<button class="${k==="⌫"||k==="C"?"act":""}" data-r="key" data-k="${k}" aria-label="${k==="⌫"?"Delete digit":k==="C"?"Clear":k}">${k}</button>`).join("")}</div>`;
  const dt=el.querySelector("#r-date");if(dt)dt.onchange=()=>{R.date=dt.value||todayStr();drawRec();};
  const nt=el.querySelector("#r-note");if(nt){nt.oninput=()=>{R.note=nt.value};nt.onkeydown=e=>{if(e.key==="Enter"){R.noteOpen=false;drawRec();}};if(R.focusNote){R.focusNote=false;setTimeout(()=>nt.focus(),50);}}
}
function recKey(k){
  let s=R.amt;
  if(k==="00"){recKey("0");recKey("0");return;}
  if(k==="⌫")s=s.slice(0,-1);else if(k==="C")s="";
  else if(k==="."){if(!s.includes("."))s=(s||"0")+".";}
  else{if(s.includes(".")&&s.split(".")[1].length>=2)return;if(s==="0"&&k!==".")s="";s=(s+k).replace(/^0+(?=\d)/,"");if(s.replace(".","").length>9)return;}
  R.amt=s;drawRec();
}
function recSave(){
  const amt=num(R.amt);if(amt<=0)return;
  const ex=R.ex;
  const t={id:ex?ex.id:rid(),type:R.type,amount:amt,account:R.acc,date:R.date,note:(R.note||"").trim(),created:ex?ex.created||Date.now():Date.now()};
  if(R.type==="transfer"){t.toAccount=R.to;if(ex&&ex.category)t.category=ex.category;}else t.category=R.cat;
  for(const k of ["plan","src","goalId","withdraw"])if(ex&&ex[k]!=null&&ex.type===R.type)t[k]=ex[k];
  if(ex&&ex.type!==R.type)unlinkTx(ex);
  putTx(t);
  let linked=null;
  if(!ex){linked=t.type==="income"?autoLinkIncome(t):autoLink(t);}
  if(isSpend(acc(R.acc)))S().lastAccount=R.acc;
  commit();closeRec();
  const what=t.type==="transfer"?"Transfer":t.category;
  if(ex)toast("Updated");
  else toast(linked?`${esc(linked.name)} ticked off in your plan`:`${t.type==="income"?"+":t.type==="expense"?"−":""}${CUR()} ${fmt(amt)} ${what}`,"Undo",()=>{if(t.plan)unlinkTx(t);delTx(t.id);commit();});
}
$("#rec").addEventListener("click",e=>{
  const b=e.target.closest("[data-r]");if(!b)return;const r=b.dataset.r;
  if(r==="key")recKey(b.dataset.k);
  else if(r==="close"){if(R.picking){R.picking=null;drawRec();}else closeRec();}
  else if(r==="type"){R.type=b.dataset.v;R.cat="";R.picking=null;if(R.type==="transfer"&&(!R.to||R.to===R.acc))R.to=(accounts().find(a=>a.id!==R.acc)||{}).id||"";if(R.type!=="transfer"&&!recAccountsFor().some(a=>a.id===R.acc))R.acc=defAcc();drawRec();}
  else if(r==="cat"){R.cat=b.dataset.n;drawRec();}
  else if(r==="pick"){R.picking=b.dataset.w==="to"?"to":"acc";drawRec();}
  else if(r==="setacc"){if(R.picking==="to")R.to=b.dataset.id;else R.acc=b.dataset.id;R.picking=null;drawRec();}
  else if(r==="note"){R.noteOpen=!R.noteOpen;R.focusNote=R.noteOpen;drawRec();}
  else if(r==="save")recSave();
  else if(r==="newcat")sheetCat(null,R.type,true);
  else if(r==="newacc"){closeRec();sheetAddAccount();}
  else if(r==="del"){const ex=R.ex;closeRec();ask("Delete this record?",`${RM(ex.amount)}, ${esc(ex.category||"Transfer")}, ${dLabel(ex.date)}.${ex.plan?" It will also be un-ticked in your plan.":""}`,"Delete",()=>{unlinkTx(ex);delTx(ex.id);commit();toast("Deleted");},true);}
});

/* ===== accounts ===== */
function sheetAddAccount(type,kind){
  if(!type){openSheet(`<h2>Add an account</h2><div class="pick">${ATYPES.map(([v,n,e])=>`<button data-v="${v}"><span class="e">${e}</span>${n}</button>`).join("")}</div>`,sh=>sh.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>sheetAddAccount(b.dataset.v)));return;}
  if(type==="debt"&&!kind){openSheet(`<h2>What kind of debt?</h2><div class="pick">${DEBT_KINDS.map(([v,n,e])=>`<button data-v="${v}"><span class="e">${e}</span>${n}</button>`).join("")}</div>`,sh=>sh.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>sheetAddAccount("debt",b.dataset.v)));return;}
  if(type==="cash")return sheetAccountForm(null,{type:"cash",provider:"cash",name:accounts().some(a=>a.type==="cash")?"Cash 2":"Cash"});
  const list=providersFor(type,kind);
  const title=type==="bank"?"Which bank?":type==="ewallet"?"Which e-wallet?":type==="savings"?"Where are your savings?":kind==="bnpl"?"Which PayLater?":kind==="study"?"Who is the loan with?":kind==="card"?"Which bank is the card from?":"Which bank or lender?";
  const draw=(sh,q)=>{sh.querySelector("#pl").innerHTML=list.filter(p=>!q||p[1].toLowerCase().includes(q.toLowerCase())).map(p=>{const fg=lum(p[2])>.6?"#1A1F36":"#fff";return `<button class="row" data-p="${p[0]}"><span class="badge" style="background:${p[2]};color:${fg}">${esc(p[3])}</span><div class="main"><div class="t">${esc(p[1])}</div></div><span class="chev">›</span></button>`}).join("");
    sh.querySelectorAll("#pl [data-p]").forEach(b=>b.onclick=()=>{const p=list.find(x=>x[0]===b.dataset.p);let name=p[0]==="other"?"":p[1];if(type==="debt"&&kind==="card"&&name)name+=" credit card";if(type==="debt"&&["car","motor","personal","housing"].includes(kind)&&name)name+=" "+DEBT_KINDS.find(k=>k[0]===kind)[1].toLowerCase();sheetAccountForm(null,{type,kind,provider:p[0],name});});};
  openSheet(`<h2>${title}</h2>${list.length>8?`<input class="search" id="ps" placeholder="Search">`:""}<div class="plist" id="pl"></div>`,sh=>{draw(sh,"");const s=sh.querySelector("#ps");if(s)s.oninput=()=>draw(sh,s.value);});
}
function sheetAccountForm(id,preset){

  if(type==="debt")return sheetDebtForm(a,preset);

  <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${badgeHTML(base)}<div class="muted small">${esc(prov(base)[1])}</div></div>
  <div class="field"><label>Name</label><input id="ac-n" value="${esc(base.name||"")}" placeholder="e.g. Maybank savings"></div>
  <div class="field"><label>How much is in it now?</label><input id="ac-b" class="big num" inputmode="decimal" value="${a?accBalance(a):""}" placeholder="0.00"></div>
  <button class="btn" id="ac-ok">${a?"Save":"Add account"}</button>${a?`<div class="btns"><button class="btn danger" id="ac-del">Remove account</button></div>`:""}`,sh=>{
    sh.querySelector("#ac-ok").onclick=()=>{
      const name=sh.querySelector("#ac-n").value.trim()||prov(base)[1],v=num(sh.querySelector("#ac-b").value);

    box.querySelectorAll("[data-x]").forEach(x=>x.onclick=()=>{plans.splice(+x.dataset.x,1);drawPlans(sh);});};
  const kn=DEBT_KINDS.find(k=>k[0]===kind)[1];
  openSheet(`<h2>${a?esc(a.name):"New "+kn.toLowerCase()}</h2>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${badgeHTML(base)}<div class="muted small">${esc(kn)}</div></div>
  <div class="field"><label>Name</label><input id="d-n" value="${esc(base.name||"")}" placeholder="e.g. ${kind==="card"?"Maybank Visa":kind==="bnpl"?"Atome":"Car loan"}"></div>
  ${loan?`
  <div class="two"><div class="field"><label>Monthly instalment</label><input id="d-mo" class="num" inputmode="decimal" value="${lp?lp.monthly:(linked?amountFor(linked,m):"")}" placeholder="0.00"></div><div class="field"><label>Last payment month</label><input id="d-end" type="month" value="${lp&&lp.end||""}"></div></div>
  <p class="small muted" style="margin:-6px 0 12px">Check your loan statement or app for the last instalment date.</p>

  `:`
  <div class="field"><label>Owed now${kind==="card"?" (from your statement or app)":""}</label><input id="d-o" class="big num" inputmode="decimal" value="${a?stmtOwed(a):""}" placeholder="0.00"></div>
  <div class="two"><div class="field"><label>Interest % a year</label><input id="d-r" class="num" inputmode="decimal" value="${a?a.rate:(kind==="card"?18:0)}"></div><div class="field"><label>Due day</label><input id="d-due" inputmode="numeric" value="${linked&&linked.dueDay||""}" placeholder="e.g. 24"></div></div>
  <div class="field"><label>I usually pay each month</label><input id="d-pay" class="num" inputmode="decimal" value="${linked?amountFor(linked,m):""}" placeholder="optional"></div>
  <div class="field"><label>${kind==="card"?"Instalment plans (BC / EPP)":"Instalments"}</label><div id="cp"></div><button class="linkbtn" id="cp-add" style="margin-top:6px">Add an instalment plan</button></div>`}
  <div class="toggle"><span>Put the monthly payment in my plan<small>So the money is set aside each month</small></span><span class="sw ${!a||linked?"on":""}" id="d-plan"></span></div>
  <button class="btn" id="d-ok">${a?"Save":"Add debt"}</button>
  ${a?`<div class="btns">${!loan?`<button class="btn ghost" id="d-int">Add an interest or late charge</button>`:""}<button class="btn danger" id="d-del">Remove</button></div>`:""}
  ${kind==="card"?`<p class="hint">Cards usually charge 15–18% a year on what isn't paid in full.</p>`:kind==="bnpl"?`<p class="hint">PayLater usually has no interest, but late fees apply.</p>`:`<p class="hint">What you owe is worked out from the instalments left.</p>`}`,sh=>{
    bindSw(sh);drawPlans(sh);
    const add=sh.querySelector("#cp-add");if(add)add.onclick=()=>{plans.push({id:rid(),name:"",monthly:0,end:addM(m,12),from:m});drawPlans(sh);};
    sh.querySelector("#d-ok").onclick=()=>{
      const name=sh.querySelector("#d-n").value.trim()||prov(base)[1];
      const o=a||{id:rid(),type:"debt",kind,provider:base.provider,opening:0,plans:[]};
      o.name=name;o.rate=num(sh.querySelector("#d-r").value);
      const due=parseInt(sh.querySelector("#d-due").value)||null;
      let pay=0;
      if(loan){const mo=num(sh.querySelector("#d-mo").value),end=sh.querySelector("#d-end").value;pay=mo;
        o.plans=mo>0?[Object.assign({id:"loan",name:"Instalment",from:(lp&&lp.from)||m},{monthly:mo,end:end||null})]:[];
        if(!a)accounts().push(o);
        if(!a){o.opening=0;}
      }else{
        o.plans=plans.filter(p=>p.monthly>0).map(p=>Object.assign({from:m},p));
        if(!a)accounts().push(o);
        const v=-Math.abs(num(sh.querySelector("#d-o").value));o.opening=r2((o.opening||0)+(v-accBalance(o)));
        pay=num(sh.querySelector("#d-pay").value);
      }
      const want=sh.querySelector("#d-plan").classList.contains("on")&&pay>0;
      if(want){if(linked){if(pay!==amountFor(linked,m)){linked.amounts=(linked.amounts||[]).filter(e=>e.from<m);linked.amounts.push({from:m,amount:pay});}linked.dueDay=due;linked.name=linked.name||name;}
        else items().push({id:rid(),name:name+(loan?"":" payment"),group:"commit",kind:"fixed",amounts:[{from:m,amount:pay}],dueDay:due,start:m,payTo:o.id,category:null,payFrom:null,note:""});}
      else if(linked&&!sh.querySelector("#d-plan").classList.contains("on"))linked.end=m;
      commit();closeSheet();toast(a?"Saved":name+" added");
    };
    const it=sh.querySelector("#d-int");if(it)it.onclick=()=>{
      const est=r2(stmtOwed(a)*(a.rate||0)/1200);
      openSheet(`<h2>Interest or late charge</h2><div class="field"><label>Amount on your statement</label><input id="ic-a" class="big num" inputmode="decimal" value="${est||""}"></div><p class="hint">Estimate at ${a.rate||0}% a year: ${RM(est)}.</p><div class="btns"><button class="btn" id="ic-ok">Add charge</button></div>`,s2=>{
        s2.querySelector("#ic-ok").onclick=()=>{const v=num(s2.querySelector("#ic-a").value);if(v<=0)return;ensureCat("Interest & charges","expense","debt","📉");putTx({id:rid(),type:"expense",amount:v,account:a.id,category:"Interest & charges",note:"",date:todayStr(),created:Date.now()});commit();closeSheet();toast("Charge added");};
      });
    };
    const del=sh.querySelector("#d-del");if(del)del.onclick=()=>removeAccount(a);
  });
}

  ask("Remove "+esc(a.name)+"?","It has no records, so nothing else changes.","Remove",()=>{S().accounts=accounts().filter(z=>z.id!==a.id);items().forEach(i=>{if(i.payFrom===a.id)i.payFrom=null;if(i.payTo===a.id)i.end=thisYM();});goals().forEach(g=>{if(g.account===a.id)g.account=null});commit();},true);

  let h=`<h2>Categories</h2><div class="seg" id="c-seg" style="margin-bottom:12px"><button data-v="expense" class="${type==="expense"?"on":""}">Spending</button><button data-v="income" class="${type==="income"?"on":""}">Income</button></div>`;
  if(type==="expense"){for(const g of groups()){const gl=list.filter(c=>c.group===g.id);if(!gl.length)continue;h+=`<div class="day">${esc(g.name)}</div><div class="panel">${gl.map(row).join("")}</div>`;}
    const orphan=list.filter(c=>!groups().some(g=>g.id===c.group));if(orphan.length)h+=`<div class="day">Others</div><div class="panel">${orphan.map(row).join("")}</div>`;}

  <div class="field"><label>Icon</label><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px" id="ct-e">${EMOJIS.map(e=>`<button data-e="${e}" style="font-size:22px;padding:6px 0;border-radius:10px;${e===icon?"background:var(--brand-soft)":""}">${e}</button>`).join("")}</div></div>
  ${type==="expense"?`<div class="field"><label>Group</label><select id="ct-g">${groupOptions(c?c.group:"other")}</select></div>`:""}

    sh.querySelectorAll("#ct-e button").forEach(b=>b.onclick=()=>{icon=b.dataset.e;sh.querySelectorAll("#ct-e button").forEach(x=>x.style.background=x===b?"var(--brand-soft)":"");});

/* ===== plan ===== */
function sheetPay(m,key){
  const l=findLine(m,key);if(!l)return;
  const def=m===thisYM()?todayStr():(m<thisYM()?m+"-28":todayStr());
  const to=l.payTo?acc(l.payTo):null;
  openSheet(`<h2>${l.goal?"Save for "+esc(l.goal.name):"Pay "+esc(l.name)}</h2>
  <div class="field"><label>Amount</label><input class="big num" id="p-amt" inputmode="decimal" value="${l.amount}"></div>
  <div class="two"><div class="field"><label>From</label><select id="p-acc">${accOptions(l.payFrom||defAcc(),a=>a.id!==l.payTo&&a.type!=="debt"||a.id===l.payFrom)}</select></div><div class="field"><label>Date</label><input type="date" id="p-date" value="${def}"></div></div>
  ${to?`<p class="hint" style="margin-top:-6px">Goes to ${esc(to.name)}${to.type==="debt"?", so you'll owe less":""}.</p>`:l.goal?`<p class="hint" style="margin-top:-6px">The money stays in your account, set aside for this goal.</p>`:""}
  <div class="toggle"><span>Record it<small>Turn off if you've already recorded this payment</small></span><span class="sw on" id="p-rec"></span></div>
  <button class="btn" id="p-ok">${l.goal?"Mark as saved":"Mark as paid"}</button>`,sh=>{
    bindSw(sh);
    sh.querySelector("#p-ok").onclick=()=>{
      const amt=num(sh.querySelector("#p-amt").value),date=sh.querySelector("#p-date").value||todayStr(),from=sh.querySelector("#p-acc").value,rec=sh.querySelector("#p-rec").classList.contains("on");
      let txId=null;
      if(l.goal)txId=goalTx(l.goal,amt,from,date,false,rec?{plan:{m,k:key}}:{plan:{m,k:key},type:"save"});
      else if(rec){txId=rid();putTx(to?{id:txId,type:"transfer",amount:amt,account:from,toAccount:to.id,category:l.name,note:"",date,plan:{m,k:key},created:Date.now()}:{id:txId,type:"expense",amount:amt,account:from,category:l.category,note:l.category!==l.name?l.name:"",date,plan:{m,k:key},created:Date.now()});}
      const patch={paid:true,paidOn:date,txId};if(amt!==l.amount)patch.amount=amt;
      setLine(m,l,patch);commit();closeSheet();toast(l.goal?"Saved":l.name+" paid");
    };
  });
}
function sheetUnpay(m,key){const l=findLine(m,key);if(!l)return;ask(esc(l.name),`Paid ${l.paidOn?dLabel(l.paidOn):""}, ${RM(l.amount)}. Marking it unpaid also deletes the record it made.`,"Mark as not paid",()=>{if(l.txId)delTx(l.txId);setLine(m,l,{paid:false,paidOn:null,txId:null});commit();},true);}
function sheetLine(m,key){
  const l=findLine(m,key);if(!l)return;const isBud=l.kind==="budget";
  openSheet(`<h2>${esc(l.name)}</h2><p class="muted small" style="margin-top:-10px">${mLabel(m)}</p>
  <div class="field"><label>Amount this month</label><input class="big num" id="l-amt" inputmode="decimal" value="${l.amount}"></div>
  ${l.extra?`<div class="field"><label>Name</label><input id="l-name" value="${esc(l.name)}"></div><div class="field"><label>Group</label><select id="l-grp">${groupOptions(l.group,true)}</select></div>`:l.goal?"":`<div class="toggle"><span>Use this amount from now on</span><span class="sw" id="l-fut"></span></div>`}
  ${!isBud?`<div class="field"><label>Due day</label><input id="l-due" inputmode="numeric" value="${l.dueDay||""}" placeholder="e.g. 26"></div>`:`<p class="hint">Spending recorded as ${esc(l.category)} counts against this budget. Spent so far: ${RM(l.spent)}.</p><div class="toggle"><span>Close this budget for the month</span><span class="sw ${l.paid?"on":""}" id="l-close"></span></div>`}
  <button class="btn" id="l-ok">Save</button>
  <div class="btns">${!isBud?(l.paid?`<button class="btn ghost" id="l-unpay">Mark as not paid</button>`:`<button class="btn ghost" id="l-pay">${l.goal?"Save now":"Pay now"}</button>`):""}
  ${!l.extra&&!l.goal?`<button class="btn ghost" data-act="item" data-id="${esc(l.id)}">Edit monthly payment</button>`:""}${l.goal?`<button class="btn ghost" data-act="goal" data-id="${esc(l.id)}">Open goal</button>`:""}
  <button class="btn danger" id="l-skip">${l.extra?"Delete":"Skip this month"}</button></div>`,sh=>{
    bindSw(sh);
    sh.querySelector("#l-ok").onclick=()=>{
      const amt=num(sh.querySelector("#l-amt").value),dueEl=sh.querySelector("#l-due"),due=dueEl?(parseInt(dueEl.value)||null):undefined;
      if(l.extra){const nm=(sh.querySelector("#l-name").value||"").trim()||l.name;mutMonth(m,d=>{d.extras=(d.extras||[]).map(x=>x.id===l.id?Object.assign(x,{amount:amt,name:nm,dueDay:due,group:sh.querySelector("#l-grp").value}):x)});}
      else{const patch={};const fut=sh.querySelector("#l-fut");
        if(fut&&fut.classList.contains("on")){const it=items().find(i=>i.id===l.id);it.amounts=(it.amounts||[]).filter(e=>e.from<m);it.amounts.push({from:m,amount:amt});patch.amount=null;for(const k of Object.keys(D.months))if(k>m&&D.months[k].lines&&D.months[k].lines[l.key]&&!D.months[k].lines[l.key].paid)delete D.months[k].lines[l.key].amount;}

  });
}

function sheetItem(id,keep,st){

function backup(){

  const name="earmark-backup-"+todayStr()+".json";let file=null;try{file=new File([blob],name,{type:"application/json"})}catch(_){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(()=>{});
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);}
  render();toast("Backup saved");
}

async function decodeSetup(code){
  code=String(code).trim().replace(/^.*#setup=/,"").replace(/\s+/g,"");const b64=code.replace(/-/g,"+").replace(/_/g,"/");
  const bin=Uint8Array.from(atob(b64+"===".slice((b64.length+3)%4)),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  const json=JSON.parse(txt);if(!json||!json.data||!json.data.settings)throw new Error("bad");return json;
}
function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c;}if(f||row.length){row.push(f);rows.push(row)}return rows;}
function importCSV(text){
  const rows=parseCSV(text.replace(/^﻿/,""));const hi=rows.findIndex(r=>r[0]==="Date"&&r.includes("Amount")&&r.includes("Type"));if(hi<0)return null;

  const seen=new Set(D.tx.map(x=>x.src).filter(Boolean));
  const accFor=name=>{name=(name||"").trim()||"Imported";let a=accounts().find(x=>x.name.toLowerCase()===name.toLowerCase());if(!a){a={id:rid(),name,type:"bank",provider:"other",opening:0};accounts().push(a);}return a.id;};
  let added=0;
  for(const r of rows.slice(hi+1)){if(!r[iD]||!/^\d{4}-\d{2}-\d{2}/.test(r[iD]))continue;const type=(r[iT]||"").toLowerCase(),amt=num(r[iA]);if(!amt)continue;
    const src="mp|"+r[iD]+"|"+amt+"|"+type+"|"+r[iAc]+"|"+(iTo>=0?r[iTo]||"":"");if(seen.has(src))continue;seen.add(src);
    const t={id:rid(),date:r[iD].slice(0,10),created:Date.parse(r[iD].replace(" ","T"))||Date.now(),amount:Math.abs(amt),account:accFor(r[iAc]),note:iN>=0?(r[iN]||"").trim():"",src};
    if(type==="transfer"){t.type="transfer";t.toAccount=accFor(r[iTo]);}else{t.type=type==="income"?"income":"expense";t.category=(r[iC]||"Others").trim();ensureCat(t.category,t.type,"other");}
    D.tx.push(t);added++;}
  return added;
}
function handleFile(file){
  const rd=new FileReader();
  rd.onload=()=>{const text=String(rd.result);let json=null;try{json=JSON.parse(text)}catch(_){}
    if(json&&json.data&&json.data.settings){restoreJson(json);return;}
    if(!D)D=freshData();const n=importCSV(text);
    if(n==null){toast("That file isn't an Earmark backup");return}
    commit();closeSheet();toast(n+" records added");};
  rd.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.closest("#rec"))return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case "tab":UI.tab=ds.tab;UI.page=null;closeSheet();render();window.scrollTo(0,0);break;
    case "tabplan":UI.tab="plan";UI.page=null;render();window.scrollTo(0,0);break;
    case "page":UI.page=ds.p;closeSheet();render();window.scrollTo(0,0);break;
    case "back":UI.page=null;render();window.scrollTo(0,0);break;
    case "close":closeSheet();break;
    case "start":D=freshData();commit();break;
    case "rec":closeSheet();openRec(ds.t||"expense");break;
    case "edittx":{const x=D.tx.find(t=>t.id===ds.id);if(!x)break;if(x.type==="save"){const g=goals().find(y=>y.id===x.goalId);ask(esc((x.withdraw?"Taken from ":"Saved for ")+(g?g.name:"goal")),`${RM(x.amount)} on ${dLabel(x.date)}.`,"Delete",()=>{unlinkTx(x);delTx(x.id);commit();},true);}else openRec(null,ds.id);break;}
    case "pm":UI.viewMonth=addM(UI.viewMonth||thisYM(),+ds.d);render();break;
    case "am":UI.actMonth=addM(UI.actMonth||thisYM(),+ds.d);render();break;
    case "rv":UI.recView=ds.v;render();break;
    case "filter":UI.filter=ds.v;render();break;
    case "pay":sheetPay(ds.m,ds.k);break;
    case "toggle":{const l=findLine(ds.m,ds.k);if(l)(l.paid?sheetUnpay:sheetPay)(ds.m,ds.k);break;}
    case "line":sheetLine(ds.m,ds.k);break;
    case "inctoggle":{const l=incomeLines(ds.m).find(x=>x.id===ds.k);if(!l)break;if(l.received)ask(esc(l.name),"Mark as not received? This deletes the record it made.","Mark as not received",()=>{if(l.txId)delTx(l.txId);setInc(ds.m,l.id,{received:null,txId:null});commit();},true);else sheetReceive(ds.m,ds.k);break;}
    case "incline":sheetIncLine(ds.m,ds.k);break;
    case "incomes":sheetIncomes();break;
    case "income":sheetIncome(ds.id||null);break;
    case "addplan":sheetAddPlan(ds.m||thisYM());break;
    case "items":sheetItems();break;
    case "item":sheetItem(ds.id);break;
    case "addacc":sheetAddAccount();break;
    case "adddebt":sheetAddAccount("debt");break;
    case "account":{const x=acc(ds.id);if(x)sheetAccountForm(x.id);break;}
    case "balances":sheetBalances();break;
    case "cats":sheetCats("expense");break;
    case "cat":sheetCat(ds.n||null,ds.t);break;
    case "groups":sheetGroups();break;
    case "goal":goalDetail(ds.id);break;
    case "addgoal":sheetGoalForm(null);break;
    case "quick":sheetQuick();break;
    case "currency":sheetCurrency();break;
    case "backup":backup();break;
    case "import":$("#filein").value="";$("#filein").click();break;
    case "wipe":ask("Delete everything?","This removes all your records from this phone. Save a backup first if you might want them back.","Delete everything",()=>{try{localStorage.removeItem(KEY)}catch(_){}D=null;UI.tab="home";UI.page=null;render();},true);break;
  }
});
$("#filein").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f);});

/* ---------- boot ---------- */
D=load();if(D)normalize(D);
render();
const h=location.hash;
if(h.startsWith("#setup=")){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}decodeSetup(h).then(restoreJson).catch(()=>toast("That setup link didn't work"));}
else if(h==="#spent"||h==="#received"){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}openRec(h==="#spent"?"expense":"income");}
else if(D&&S().startOn==="spent")openRec("expense");
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
