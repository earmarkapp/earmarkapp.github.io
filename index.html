<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earmark — know what's safe to spend</title>
<meta name="description" content="A simple budget app that sets aside money for the payments you still owe this month, tracks your savings goals and debts, and shows what's actually safe to spend. Your data stays on your phone.">
<meta name="theme-color" content="#2E6B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Earmark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F4F2EC; --card:#FFFFFF; --ink:#1B1C1A; --muted:#7D7A72; --line:#E7E3DA;
  --accent:#2E6B4E; --accent-soft:#E3EFE8; --on-accent:#fff; --warn:#B4441C; --warn-soft:#F8E6DD;
  --amber:#A86A12; --amber-soft:#F6EBD6; --chip:#EEEBE3; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  --hero:#2E6B4E;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121412; --card:#1C1F1D; --ink:#ECEDE9; --muted:#9A9C95; --line:#2B2F2C;
    --accent:#6FC29A; --accent-soft:#1E3329; --on-accent:#0F1D16; --warn:#F08A63; --warn-soft:#3A2219;
    --amber:#E4B061; --amber-soft:#36291A; --chip:#272B28; --shadow:none; --hero:#24503B; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
a{color:var(--accent)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 100px)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand img{width:28px;height:28px;border-radius:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px}
.hero.hneg{background:var(--warn);color:#fff}
.hero .lbl{opacity:.85;font-size:13px;font-weight:600}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.hero .rows{display:grid;gap:6px;font-size:14px}
.hero .row{display:flex;justify-content:space-between;gap:10px;opacity:.95}
.hero .row b{font-weight:700;white-space:nowrap}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.sec-title h3{margin:0;font-size:15px;font-weight:700}
.sec-title .link{color:var(--accent);font-weight:600;font-size:13px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{background:var(--amber);color:#fff;padding:7px 12px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap}
@media (prefers-color-scheme: dark){.banner button{color:#1b1b1b}}
.line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:800;font-size:14px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ln-main{flex:1;min-width:0}
.ln-name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ln-sub{font-size:12.5px;color:var(--muted)}
.ln-sub.late{color:var(--warn);font-weight:600}
.ln-amt{font-weight:700;text-align:right;white-space:nowrap}
.line.done .ln-name,.line.done .ln-amt{color:var(--muted)}
.line.done .ln-amt{text-decoration:line-through;text-decoration-thickness:1px}
.chip{display:inline-block;background:var(--chip);color:var(--muted);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:lowercase}
.chip.g{background:var(--accent-soft);color:var(--accent)}
.paybtn{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px;white-space:nowrap}
.bar{height:7px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--warn)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.grp-h h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.grp-h .num{font-weight:700;font-size:14px}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:12px}
.monthbar button{width:40px;height:36px;border-radius:10px;font-size:20px;font-weight:700;color:var(--accent)}
.monthbar .m{font-weight:700}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:19px;font-weight:800;margin-top:2px}
.pos{color:var(--accent)} .neg{color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:none;font-size:14px}
.av.in{background:var(--accent-soft);color:var(--accent)}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 4px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:5}
nav.tabs .in{max-width:520px;width:100%;display:flex;justify-content:space-around}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:12px;min-width:64px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:500;display:grid;place-items:center;box-shadow:0 8px 20px rgba(46,107,78,.35);z-index:6}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s ease;z-index:21;max-height:90vh;overflow:auto}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 12px}
#sheet h2{margin:0 0 14px;font-size:18px;font-weight:800}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field textarea{width:100%;min-height:120px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:13px/1.4 ui-monospace,monospace;color:var(--ink);word-break:break-all}
.amt-in{font-size:30px !important;font-weight:800;text-align:center;padding:14px !important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:13.5px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:600}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15.5px;margin-top:6px;text-align:center;text-decoration:none}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.kofi{background:#FF5E5B;color:#fff}
.btns{display:grid;gap:8px;margin-top:10px}
.list-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.list-btn:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.welcome{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 6px}
.welcome img{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(46,107,78,.25)}
.welcome h1{font-size:30px;letter-spacing:-.03em;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 auto 22px;max-width:340px}
.points{text-align:left;display:grid;gap:10px;margin:0 auto 24px;max-width:340px}
.points div{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px}
.points b{flex:none;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
.steps .line{cursor:pointer}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin:22px 0 4px}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-name{font-weight:700;font-size:15.5px}
.debt-bal{font-size:22px;font-weight:800;margin:4px 0}

nav.tabs button{min-width:0;flex:1;padding:4px 2px}
.mchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchips button{padding:8px 0;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:13px}
.mchips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.grp-row{margin-bottom:12px}
.grp-row .cats{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.mini{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.mini b{color:var(--ink);font-weight:700}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:70px;margin-top:8px}
.hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted);font-weight:600}
.hist i{display:block;width:70%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.hist i.miss{background:var(--line)}
.inline-row{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;margin-bottom:6px}
.inline-row input{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);width:100%}
.inline-row button{border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:800}
.plan-row{display:grid;grid-template-columns:1fr 84px 104px 30px;gap:6px;margin-bottom:6px}
.plan-row input{padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);width:100%;font-size:15px}
.plan-row button{border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:800}
h3.sub{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>Planned</button>
  <button data-act="tab" data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Spending</button>
  <button data-act="tab" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7c-1-2-3.5-3-7-3-5 0-8 3-8 7 0 2.5 1.2 4.3 3 5.5V20h3v-2h4v2h3v-3.2c1.2-.8 2-1.8 2.4-2.8H21v-4h-1.6c-.2-.8-.6-1.6-1.2-2.3"/><circle cx="15" cy="10" r="1"/></svg>Goals</button>
  <button data-act="tab" data-tab="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Debts</button>
</div></nav>
<button class="fab" id="fab" data-act="addtx" hidden aria-label="Add transaction">+</button>
<div id="scrim" data-act="close"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="filein" accept=".json,.csv,application/json,text/csv" hidden>

<script>
/* ===== Settings you can change ===== */
const CONFIG = {
  appName: "Earmark",
  supportUrl: "",            // e.g. "https://ko-fi.com/yourname" — leave "" to hide the Support button
  supportLabel: "Buy me a coffee",
  madeBy: "@nurulkhairida_",
  madeByUrl: "https://www.instagram.com/nurulkhairida_/",
  currency: "RM"
};
</script>
<script>
(function(){
"use strict";
const KEY="earmark:v1";
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SPEND=new Set(["bank","ewallet","cash"]);
const ATYPES=[["bank","Bank"],["ewallet","E-wallet"],["cash","Cash"],["savings","Savings / investment"],["credit","Card / paylater / loan"]];
const CKINDS=[["card","Credit card"],["paylater","Paylater / BNPL"],["loan","Loan"]];
const DEF_GROUPS=[["commit","Commitments"],["bills","Bills & subscriptions"],["food","Food"],["transport","Transport"],["shopping","Shopping"],["selfcare","Self-care & health"],["fun","Entertainment"],["family","Family & giving"],["debt","Debt payments"],["save","Savings"],["other","Others"]];
const DEF_EXP=[["Rent","commit"],["Car loan","commit"],["Insurance","commit"],["Phone & internet","bills"],["Utilities","bills"],["Subscriptions","bills"],["Food","food"],["Groceries","food"],["Petrol","transport"],["Transport","transport"],["Shopping","shopping"],["Beauty","selfcare"],["Medical","selfcare"],["Entertainment","fun"],["Travel","fun"],["Family","family"],["Interest & charges","debt"],["Others","other"]];
const DEF_INC=["Salary","Bonus","Side income","Family","Refund","Others"];
const TEMPLATES={trip:["Flights","Accommodation","Food","Transport","Shopping & activities","Insurance & visa"],gadget:["Price","Accessories"],emergency:[],custom:[]};

let D=null;
const UI={tab:"home",viewMonth:null,actMonth:null,openGroup:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>r2(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(+n||0).toLocaleString("en-MY");
const CUR=()=>(D&&D.settings.currency)||CONFIG.currency;
const RM=n=>(r2(n)<0?"-":"")+CUR()+" "+fmt(Math.abs(n));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>dstr(new Date());
const ymOf=d=>String(d).slice(0,7);
const thisYM=()=>ymOf(todayStr());
function addM(ym,k){let [y,m]=ym.split("-").map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m);}
function mDiff(a,b){const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return (yb-ya)*12+(mb-ma);}
const mLabel=ym=>{const [y,m]=ym.split("-");return MONTHS[+m-1]+" "+y;};
const mShort=ym=>{const [y,m]=ym.split("-");return MONTHS[+m-1]+"'"+y.slice(2);};
const dLabel=d=>{const [y,m,dd]=d.split("-");return (+dd)+" "+MONTHS[+m-1];};
function ord(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2400);}
function num(v){const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?r2(n):0;}

/* ---------- storage ---------- */
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast("Couldn't save on this device — storage may be full");}}
function commit(){save();render();}
function freshData(){return normalize({v:2,settings:{currency:CONFIG.currency,balanceSet:false,lastBackup:null,
  accounts:[{id:"bank",name:"Bank",type:"bank",opening:0},{id:"ewallet",name:"E-wallet",type:"ewallet",opening:0},{id:"cash",name:"Cash",type:"cash",opening:0}],
  items:[],incomes:[],goals:[]},months:{},tx:[]});}
function normalize(d){
  d.settings=d.settings||{};const s=d.settings;
  if(!s.groups||!s.groups.length)s.groups=DEF_GROUPS.map(([id,name])=>({id,name}));
  if(!s.categories)s.categories=[...DEF_EXP.map(([name,group])=>({name,type:"expense",group})),...DEF_INC.map(name=>({name,type:"income"}))];
  s.accounts=s.accounts||[];s.items=s.items||[];s.goals=s.goals||[];
  if(s.currency==null)s.currency=CONFIG.currency;
  d.months=d.months||{};d.tx=d.tx||[];
  if(!s.incomes){ // migrate v1 single income
    s.incomes=[];
    if(s.defaultIncome){s.incomes.push({id:"salary",name:"Salary",amounts:[{from:"2000-01",amount:s.defaultIncome}],freq:"monthly",category:"Salary"});}
    for(const [m,md] of Object.entries(d.months)){
      if(md.income!=null||md.incomeDone){md.incomes=md.incomes||{};md.incomes.salary=Object.assign({},md.income!=null?{amount:md.income}:{},md.incomeDone?{received:true,txId:md.incomeTx||null}:{});
        if(!s.incomes.length)s.incomes.push({id:"salary",name:"Salary",amounts:[{from:"2000-01",amount:md.income||0}],freq:"monthly",category:"Salary"});}
      delete md.income;delete md.incomeDone;delete md.incomeTx;
    }
    for(const t of d.tx)if(t.plan&&t.plan.k==="income")t.plan.k="i:salary";
  }
  delete s.defaultIncome;
  for(const a of s.accounts)if(a.type==="credit"){a.kind=a.kind||(/loan/i.test(a.name)?"loan":/paylater|atome|bnpl/i.test(a.name)?"paylater":"card");a.plans=a.plans||[];if(a.rate==null)a.rate=a.kind==="card"?18:0;}
  return d;
}

/* ---------- model ---------- */
const S=()=>D.settings;
const items=()=>S().items, accounts=()=>S().accounts, groups=()=>S().groups, goals=()=>S().goals, incomes=()=>S().incomes, cats=()=>S().categories;
const acc=id=>accounts().find(a=>a.id===id);
const isSpend=a=>!!a&&SPEND.has(a.type);
const itemActive=(t,m)=>(!t.start||t.start<=m)&&(!t.end||m<t.end);
function amountFor(t,m){let a=0;const l=(t.amounts||[]).slice().sort((x,y)=>x.from<y.from?-1:1);for(const e of l)if(e.from<=m)a=e.amount;return a}
const monthDoc=m=>D.months[m]||{};
const groupName=id=>{const g=groups().find(g=>g.id===id);return g?g.name:(id==="oneoff"?"One-off":"Others")};
function catGroup(name,type){if(type==="income")return "_inc";const c=cats().find(c=>c.type==="expense"&&c.name.toLowerCase()===String(name||"").toLowerCase());return c&&c.group?c.group:"other";}
function spentOn(m,cat){const n=String(cat).toLowerCase();return r2(D.tx.filter(x=>x.type==="expense"&&ymOf(x.date)===m&&String(x.category||"").toLowerCase()===n&&!x.plan).reduce((a,x)=>a+x.amount,0))}

/* income */
const incomeActive=(s,m)=>itemActive(s,m)&&(s.freq!=="custom"||(s.months||[]).includes(+m.slice(5)));
function incomeLines(m){
  const d=monthDoc(m).incomes||{};
  return incomes().filter(s=>incomeActive(s,m)).map(s=>{const o=d[s.id]||{};return o.skip?null:{key:"i:"+s.id,id:s.id,name:s.name,amount:o.amount!=null?o.amount:amountFor(s,m),received:!!o.received,txId:o.txId||null,category:s.category||s.name,account:s.account||null,freq:s.freq}}).filter(Boolean);
}
const incomeTotal=m=>r2(incomeLines(m).reduce((s,l)=>s+l.amount,0));

/* goals */
function goalSaved(g){return r2((g.initial||0)+D.tx.filter(x=>x.goalId===g.id).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0))}
const goalTarget=g=>g.parts&&g.parts.length?r2(g.parts.reduce((s,p)=>s+(+p.amount||0),0)):(g.target||0);
function goalMonthsLeft(g){return g.targetMonth?Math.max(1,mDiff(thisYM(),g.targetMonth)+1):null}
function goalNeeded(g){const left=Math.max(0,goalTarget(g)-goalSaved(g)),n=goalMonthsLeft(g);if(!n)return null;
  const paidThis=planLines(thisYM()).some(l=>l.key==="g:"+g.id&&l.paid);const months=paidThis?Math.max(1,n-1):n;return r2(left/months);}
function goalSavedIn(g,m){return r2(D.tx.filter(x=>x.goalId===g.id&&ymOf(x.date)===m).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0))}
const earmarkedGoals=()=>r2(goals().filter(g=>!g.account).reduce((s,g)=>s+Math.max(0,goalSaved(g)),0));

/* planned */
function planLines(m){
  const d=monthDoc(m),out=[],L=d.lines||{};
  for(const t of items()){
    if(!itemActive(t,m))continue;
    const l=L[t.id]||{};if(l.skip)continue;
    const o={key:t.id,id:t.id,name:t.name,group:t.group,kind:t.kind||"fixed",amount:l.amount!=null?l.amount:amountFor(t,m),paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:l.dueDay||t.dueDay||null,note:t.note||"",category:t.category||t.name,payFrom:t.payFrom||null,payTo:t.payTo||null};
    if(o.kind==="budget")o.spent=spentOn(m,o.category);
    out.push(o);
  }
  for(const g of goals()){
    if(g.done||!g.inPlan||!(g.monthly>0))continue;
    if((g.start&&m<g.start)||(g.targetMonth&&m>g.targetMonth))continue;
    const l=L["g:"+g.id]||{};if(l.skip)continue;
    out.push({key:"g:"+g.id,id:g.id,goal:g,name:"Save for "+g.name,group:"_goals",kind:"fixed",amount:l.amount!=null?l.amount:g.monthly,paid:!!l.paid,paidOn:l.paidOn||null,txId:l.txId||null,dueDay:g.dueDay||null,note:"",category:"Savings",payFrom:null,payTo:g.account||null});
  }
  for(const x of (d.extras||[]))out.push({key:"x:"+x.id,id:x.id,name:x.name,group:x.group||"oneoff",kind:"fixed",amount:x.amount,paid:!!x.paid,paidOn:x.paidOn||null,txId:x.txId||null,dueDay:x.dueDay||null,note:x.note||"",category:x.category||x.name,payFrom:null,payTo:null,extra:true});
  return out;
}
const fromCash=l=>!l.payFrom||isSpend(acc(l.payFrom));
function lineReserved(l){if(!fromCash(l))return 0;if(l.kind==="budget")return l.paid?0:Math.max(0,r2(l.amount-l.spent));return l.paid?0:l.amount;}
const findLine=(m,key)=>planLines(m).find(l=>l.key===key);
function dueText(l,m){if(!l.dueDay)return null;const due=m+"-"+pad(l.dueDay),late=!l.paid&&m===thisYM()&&todayStr()>due;return {txt:(late?"Overdue · was due ":"Due ")+ord(l.dueDay),late};}

/* accounts & debts */
function billedCount(p,upto){if(!p.from)return 0;const end=p.end&&p.end<upto?p.end:upto;return Math.max(0,mDiff(p.from,end)+1)}
function accBalance(a){
  let b=a.opening||0;
  for(const x of D.tx){
    if(x.type==="income"&&x.account===a.id)b+=x.amount;
    else if(x.type==="expense"&&x.account===a.id)b-=x.amount;
    else if(x.type==="transfer"){if(x.account===a.id)b-=x.amount;if(x.toAccount===a.id)b+=x.amount;}
  }
  if(a.type==="credit")for(const p of a.plans||[])b-=p.monthly*billedCount(p,thisYM());
  return r2(b);
}
const cashTotal=()=>r2(accounts().filter(isSpend).reduce((s,a)=>s+accBalance(a),0));
const stmtOwed=a=>r2(Math.max(0,-accBalance(a)));
function unbilled(a){const m=thisYM();return r2((a.plans||[]).reduce((s,p)=>s+p.monthly*Math.max(0,p.end?mDiff(m,p.end):0),0))}
const owed=a=>r2(stmtOwed(a)+unbilled(a));
function linkedMonthly(a,m){m=m||thisYM();return r2(items().filter(i=>i.payTo===a.id&&itemActive(i,m)).reduce((s,i)=>s+amountFor(i,m),0))}
function payoff(a){
  const P=linkedMonthly(a);let bal=stmtOwed(a);const r=(a.rate||0)/1200;let m=thisYM(),interest=0,n=0;
  const paidNow=planLines(m).filter(l=>l.payTo===a.id).every(l=>l.paid);
  if(!P)return null;
  if(!paidNow){bal-=P;}
  while(n<480){
    if(bal<=0.005&&!(a.plans||[]).some(p=>p.end&&p.end>m))break;
    n++;m=addM(m,1);
    if(bal>0){const i=bal*r;interest+=i;bal+=i;}
    for(const p of a.plans||[])if(p.end&&p.end>=m&&(!p.from||p.from<=m))bal+=p.monthly;
    bal-=P;
    if(n>12&&bal>stmtOwed(a)+unbilled(a)+1)return {never:true};
  }
  if(n>=480)return {never:true};
  return {months:n,done:paidNow&&n===0?thisYM():(n===0?thisYM():m),interest:r2(interest)};
}
function defAcc(){const a=accounts().find(a=>a.type==="bank")||accounts().find(isSpend)||accounts()[0];return a?a.id:""}

/* ---------- mutations ---------- */
function mutMonth(m,fn){D.months[m]=D.months[m]||{};fn(D.months[m]);}
function setLine(m,l,patch){
  mutMonth(m,d=>{
    if(l.extra){d.extras=(d.extras||[]).map(x=>x.id===l.id?Object.assign(x,patch):x);}
    else{d.lines=d.lines||{};const o=Object.assign(d.lines[l.key]||{},patch);for(const k in o)if(o[k]===null)delete o[k];d.lines[l.key]=o;}
  });
}
function setInc(m,id,patch){mutMonth(m,d=>{d.incomes=d.incomes||{};const o=Object.assign(d.incomes[id]||{},patch);for(const k in o)if(o[k]===null)delete o[k];d.incomes[id]=o;});}
const delTx=id=>{D.tx=D.tx.filter(x=>x.id!==id)};
function putTx(t){const i=D.tx.findIndex(x=>x.id===t.id);if(i>=0)D.tx[i]=t;else D.tx.push(t);}
function ensureCat(name,type,group){if(!name)return;if(!cats().some(c=>c.type===type&&c.name.toLowerCase()===name.toLowerCase()))cats().push(type==="income"?{name,type}:{name,type,group:group||"other"});}
function goalTx(g,amt,from,date,withdraw,extra){
  const t=Object.assign({id:rid(),amount:amt,date,goalId:g.id,created:Date.now(),category:g.name,note:withdraw?"Taken out":"Saved"},extra||{});
  if(withdraw)t.withdraw=true;
  if(extra&&extra.type==="save"){t.type="save";t.account=from;}
  else if(g.account){t.type="transfer";if(withdraw){t.account=g.account;t.toAccount=from}else{t.account=from;t.toAccount=g.account}}
  else{t.type="save";t.account=from;}
  putTx(t);return t.id;
}

    const gt=r2(gl.reduce((s,l)=>s+l.amount,0));

  }
  h+=`<div class="card"><div class="kv"><span>Income</span><span class="num">${fmt(inc)}</span></div><div class="kv"><span>Planned payments</span><span class="num">${fmt(total)}</span></div><div class="kv total"><span>Left after plan</span><span class="num ${net<0?"neg":"pos"}">${RM(net)}</span></div></div>`;
  h+=`<div class="btns"><button class="btn" data-act="addplan" data-m="${m}">+ Add planned payment</button><button class="btn ghost" data-act="items">Manage monthly items</button></div>`;
  return h;
}
function vActivity(){
  const m=UI.actMonth||thisYM();
  const list=D.tx.filter(x=>ymOf(x.date)===m).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0));
  const inn=r2(list.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0));
  const exp=list.filter(x=>x.type==="expense");
  const out=r2(exp.reduce((s,x)=>s+x.amount,0));
  const toDebt=r2(list.filter(x=>x.type==="transfer"&&acc(x.toAccount)&&acc(x.toAccount).type==="credit"&&isSpend(acc(x.account))).reduce((s,x)=>s+x.amount,0));
  const saved=r2(list.filter(x=>(x.type==="save"||(x.type==="transfer"&&acc(x.toAccount)&&acc(x.toAccount).type==="savings"&&isSpend(acc(x.account))))).reduce((s,x)=>s+(x.withdraw?-x.amount:x.amount),0));
  let h=`<div class="monthbar"><button data-act="am" data-d="-1">‹</button><div class="m">${mLabel(m)}</div><button data-act="am" data-d="1">›</button></div>`;
  h+=`<div class="sumgrid" style="margin-bottom:10px"><div class="stat"><div class="l">Money in</div><div class="v num pos">${fmt(inn)}</div></div><div class="stat"><div class="l">Spent</div><div class="v num">${fmt(out)}</div></div></div>`;
  if(toDebt||saved)h+=`<div class="card" style="padding:10px 16px">${toDebt?`<div class="mini"><span>Paid towards debts</span><b class="num">${fmt(toDebt)}</b></div>`:""}${saved?`<div class="mini"><span>Saved</span><b class="num">${fmt(saved)}</b></div>`:""}</div>`;
  const G={};for(const x of exp){const g=catGroup(x.category,"expense");G[g]=G[g]||{t:0,c:{}};G[g].t+=x.amount;const c=x.category||"Others";G[g].c[c]=(G[g].c[c]||0)+x.amount;}
  const gk=Object.keys(G).sort((a,b)=>G[b].t-G[a].t);
  if(gk.length){const mx=G[gk[0]].t;h+=`<div class="sec-title"><h3>Where it went</h3><span class="small muted">tap to see categories</span></div><div class="card">`;
    for(const g of gk){const open=UI.openGroup===g,pct=out?Math.round(G[g].t/out*100):0;
      h+=`<div class="grp-row" data-act="opengrp" data-g="${esc(g)}" style="cursor:pointer"><div class="kv" style="padding:0"><span style="font-weight:700">${esc(groupName(g))} <span class="muted small" style="font-weight:600">${pct}%</span></span><span class="num" style="font-weight:700">${fmt(G[g].t)}</span></div><div class="bar"><i style="width:${G[g].t/mx*100}%"></i></div>`;
      if(open)h+=`<div style="margin-top:6px">${Object.entries(G[g].c).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="mini"><span>${esc(c)}</span><b class="num">${fmt(v)}</b></div>`).join("")}</div>`;
      else h+=`<div class="cats">${Object.entries(G[g].c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c])=>esc(c)).join(" · ")}</div>`;
      h+=`</div>`;}
    h+=`</div>`;}
  h+=`<div class="sec-title"><h3>Transactions</h3></div>`;
  if(!list.length)return h+`<div class="card"><div class="empty">Nothing logged in ${mLabel(m)}.<br>Tap + to add spending or income.</div></div>`;
  let cur="";
  for(const x of list){
    if(x.date!==cur){if(cur)h+=`</div>`;cur=x.date;h+=`<div class="day">${dLabel(x.date)}</div><div class="card" style="padding:2px 16px;margin-bottom:4px">`;}
    const a=acc(x.account),to=acc(x.toAccount);
    let title,sub,sign="",cls="",av;
    if(x.type==="save"){title=(x.withdraw?"From ":"Saved for ")+(x.category||"goal");sub="kept in "+esc(a?a.name:"your account");sign=x.withdraw?"+":"−";av="★";}
    else if(x.type==="transfer"){title=x.category||"Transfer";sub=`${esc(a?a.name:"?")} → ${esc(to?to.name:"?")}${x.note?" · "+esc(x.note):""}`;av="⇄";}
    else{title=x.category||"Others";sub=[x.note?esc(x.note):"",a?esc(a.name):""].filter(Boolean).join(" · ");sign=x.type==="income"?"+":"−";cls=x.type==="income"?"pos":"";av=esc(title.slice(0,1).toUpperCase());}
    h+=`<button class="tx" data-act="edittx" data-id="${esc(x.id)}"><div class="av ${x.type==="income"?"in":""}">${av}</div><div class="ln-main"><div style="font-weight:600">${esc(title)}</div><div class="ln-sub">${sub}</div></div><div class="ln-amt num ${cls}">${sign}${fmt(x.amount)}</div></button>`;
  }
  return h+`</div>`;
}
function vGoals(){
  const gs=goals().filter(g=>!g.done);
  const short=gs.filter(g=>!g.targetMonth||mDiff(thisYM(),g.targetMonth)<12),long=gs.filter(g=>g.targetMonth&&mDiff(thisYM(),g.targetMonth)>=12);
  const totalSaved=r2(goals().reduce((s,g)=>s+goalSaved(g),0));
  let h=`<div class="sumgrid" style="margin-bottom:12px"><div class="stat"><div class="l">Saved in goals</div><div class="v num pos">${fmt(totalSaved)}</div></div><div class="stat"><div class="l">Saving per month</div><div class="v num">${fmt(gs.filter(g=>g.inPlan).reduce((s,g)=>s+(g.monthly||0),0))}</div></div></div>`;
  if(!gs.length)h+=`<div class="card"><div class="empty">No goals yet.<br>Save up for a trip, a new phone, or an emergency fund — ${esc(CONFIG.appName)} works out how much to put aside each month.</div></div>`;
  const card=g=>{
    const t=goalTarget(g),sv=goalSaved(g),pct=t>0?Math.min(100,sv/t*100):0,need=goalNeeded(g),ml=goalMonthsLeft(g);
    let chip="";
    if(t<=0)chip='<span class="chip amber">set your budget</span>';
    else if(sv>=t)chip='<span class="chip g">reached 🎉</span>';
    else if(need!=null&&g.inPlan&&g.monthly>=need-0.5)chip='<span class="chip g">on track</span>';
    else if(need!=null)chip='<span class="chip warn">behind</span>';
    const thisM=goalSavedIn(g,thisYM());
    return `<button class="card" data-act="goal" data-id="${esc(g.id)}" style="display:block;width:100%;text-align:left">
    <div class="debt-top"><div><div class="debt-name">${esc(g.name)} ${chip}</div><div class="small muted">${g.targetMonth?"By "+mLabel(g.targetMonth)+(ml?" · "+ml+" month"+(ml>1?"s":"")+" left":""):"No target date"}</div></div><div style="text-align:right"><div class="num" style="font-weight:800">${fmt0(sv)}</div><div class="small muted num">of ${fmt0(t)}</div></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="note">${need!=null&&t>sv?`Needs ${RM(need)}/month`:""}${g.inPlan&&g.monthly?`${need!=null&&t>sv?" · ":""}planned ${RM(g.monthly)}/month`:""}${thisM?` · saved ${RM(thisM)} this month`:""}</div></button>`;
  };
  if(short.length)h+=`<h3 class="sub">Short-term · within a year</h3>`+short.map(card).join("");
  if(long.length)h+=`<h3 class="sub">Long-term</h3>`+long.map(card).join("");
  const done=goals().filter(g=>g.done);
  if(done.length)h+=`<h3 class="sub">Completed</h3>`+done.map(g=>`<button class="list-btn card" data-act="goal" data-id="${esc(g.id)}" style="padding:14px 16px"><b>${esc(g.name)}</b><span class="num muted">${fmt0(goalSaved(g))}</span></button>`).join("");
  h+=`<div class="btns"><button class="btn" data-act="addgoal">+ New goal</button></div>`;
  return h;
}
function vDebts(){
  const cr=accounts().filter(a=>a.type==="credit");
  const total=r2(cr.reduce((s,a)=>s+owed(a),0));
  let h=`<div class="sumgrid" style="margin-bottom:12px"><div class="stat"><div class="l">Total debt</div><div class="v num">${fmt(total)}</div></div><div class="stat"><div class="l">Paying per month</div><div class="v num">${fmt(cr.reduce((s,a)=>s+linkedMonthly(a),0))}</div></div></div>`;
  if(!cr.length)h+=`<div class="card"><div class="empty">No cards, paylaters or loans yet.</div></div>`;
  for(const k of ["card","paylater","loan"]){
    const list=cr.filter(a=>a.kind===k);if(!list.length)continue;
    h+=`<h3 class="sub">${CKINDS.find(x=>x[0]===k)[1]}s</h3>`;
    for(const a of list){
      const st=stmtOwed(a),ub=unbilled(a),o=st+ub,mo=linkedMonthly(a),po=o>0?payoff(a):null;
      let rows="";
      if(ub>0)rows+=`<div class="mini"><span>${k==="loan"?"Billed, not paid yet":"Balance now"}</span><b class="num">${fmt(st)}</b></div><div class="mini"><span>${k==="loan"?"Future instalments":"Future instalments (BC / EPP)"}</span><b class="num">${fmt(ub)}</b></div>`;
      if(a.rate>0&&st>0&&k!=="loan")rows+=`<div class="mini"><span>Interest if not paid in full (${a.rate}% p.a.)</span><b class="num">~${fmt(st*a.rate/1200)}/mo</b></div>`;
      let foot="";
      if(o<=0)foot="Nothing owed 🎉";
      else if(!mo)foot="Link a monthly payment to see when it'll be cleared.";
      else if(po&&po.never)foot=`<span class="neg">At ${fmt(mo)}/month this won't be cleared — interest and instalments outpace it.</span>`;
      else if(po)foot=`At ${fmt(mo)}/month: cleared ~${mShort(po.done)}${po.interest>1?` · about ${RM(po.interest)} interest`:""}`;
      h+=`<button class="card" data-act="credit" data-id="${esc(a.id)}" style="display:block;width:100%;text-align:left"><div class="debt-top"><div><div class="debt-name">${esc(a.name)}</div><div class="debt-bal num">${RM(o)}</div></div><div style="text-align:right"><div class="small muted">Monthly</div><div class="num" style="font-weight:700">${mo?fmt(mo):"—"}</div></div></div>${rows}<div class="note">${foot}</div></button>`;
    }
  }
  h+=`<div class="btns"><button class="btn ghost" data-act="credit" data-id="">+ Add card / paylater / loan</button></div>
  <p class="note" style="text-align:center">Spending on a card or paylater adds to what you owe. Planned payments linked to it bring it down. Instalments (BC/EPP) are billed automatically each month. Interest is an estimate — update the balance from your statement anytime.</p>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html,mount){const sh=$("#sheet");sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=0;sh.classList.add("on");$("#scrim").classList.add("on");if(mount)mount(sh);}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");}
function accOptions(sel,filter){return accounts().filter(filter||(()=>true)).map(a=>`<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${esc(a.name)}${a.type==="credit"?" (owe "+fmt(stmtOwed(a))+")":" ("+fmt(accBalance(a))+")"}</option>`).join("")}
function groupOptions(sel,withOneoff){return (withOneoff?[{id:"oneoff",name:"One-off"}]:[]).concat(groups()).map(g=>`<option value="${esc(g.id)}" ${g.id===sel?"selected":""}>${esc(g.name)}</option>`).join("")}
function bindSw(sh){sh.querySelectorAll(".sw").forEach(s=>s.addEventListener("click",()=>s.classList.toggle("on")));}
function ask(title,msg,okLabel,fn,danger){openSheet(`<h2>${title}</h2><p class="muted" style="margin-top:-6px">${msg}</p><div class="btns"><button class="btn ${danger?"danger":""}" id="q-ok">${okLabel}</button><button class="btn ghost" data-act="close">Cancel</button></div>`,sh=>{sh.querySelector("#q-ok").onclick=()=>{closeSheet();fn();};});}

function sheetPay(m,key){
  const l=findLine(m,key);if(!l)return;
  const def=m===thisYM()?todayStr():(m<thisYM()?m+"-28":todayStr());
  const to=l.payTo?acc(l.payTo):null;
  openSheet(`<h2>${l.goal?"Save":"Pay"} ${esc(l.goal?l.goal.name:l.name)}</h2>
  <div class="field"><label>Amount (${CUR()})</label><input class="amt-in num" id="p-amt" inputmode="decimal" value="${l.amount}"></div>
  <div class="row2"><div class="field"><label>${l.goal?"From":"Paid from"}</label><select id="p-acc">${accOptions(l.payFrom||defAcc(),a=>a.id!==l.payTo)}</select></div><div class="field"><label>Date</label><input type="date" id="p-date" value="${def}"></div></div>
  ${l.goal?`<p class="small muted" style="margin-top:-4px">${to?`Moves the money to <b>${esc(to.name)}</b>.`:"The money stays in your account but is set aside for this goal."}</p>`:to?`<p class="small muted" style="margin-top:-4px">Goes to <b>${esc(to.name)}</b>${to.type==="credit"?" — brings what you owe down":""}.</p>`:""}
  <div class="toggle"><span>Record it in my accounts</span><span class="sw on" id="p-rec"></span></div>
  <div class="small muted" style="margin:-4px 0 8px">Turn off if you already logged this.</div>
  <button class="btn" id="p-ok">${l.goal?"Mark as saved":"Mark as paid"}</button>`,sh=>{

      const amt=num(sh.querySelector("#p-amt").value),date=sh.querySelector("#p-date").value||todayStr(),from=sh.querySelector("#p-acc").value;
      let txId=null;
      const rec=sh.querySelector("#p-rec").classList.contains("on");
      if(l.goal){txId=rec?goalTx(l.goal,amt,from,date,false,{plan:{m,k:key}}):goalTx(l.goal,amt,from,date,false,{plan:{m,k:key},type:"save"});}
      else if(rec){
        txId=rid();
        putTx(to?{id:txId,type:"transfer",amount:amt,account:from,toAccount:to.id,category:l.name,note:"",date,plan:{m,k:key},created:Date.now()}
               :{id:txId,type:"expense",amount:amt,account:from,category:l.category,note:l.category!==l.name?l.name:"",date,plan:{m,k:key},created:Date.now()});
      }
      const patch={paid:true,paidOn:date,txId};if(amt!==l.amount)patch.amount=amt;

function sheetUnpay(m,key){

  <button class="btn" id="l-ok">Save</button>

        }else patch.amount=amt;
        if(due!==undefined){const base=l.goal?l.goal.dueDay:(items().find(i=>i.id===l.id)||{}).dueDay;patch.dueDay=due!==(base||null)?due:null;}
        const cl=sh.querySelector("#l-close");if(cl)patch.paid=cl.classList.contains("on");

/* transactions */
function allCats(type){
  const freq={};D.tx.forEach(x=>{if(x.type===type&&x.category)freq[x.category]=(freq[x.category]||0)+1});
  const list=cats().filter(c=>c.type===type).map(c=>c.name);
  for(const k of Object.keys(freq))if(!list.some(n=>n.toLowerCase()===k.toLowerCase()))list.push(k);
  return list.sort((a,b)=>(freq[b]||0)-(freq[a]||0));
}
function sheetTx(id){
  const ex=id?D.tx.find(x=>x.id===id):null;
  if(ex&&ex.type==="save"){const g=goals().find(x=>x.id===ex.goalId);return ask(esc((ex.withdraw?"Taken from ":"Saved for ")+(g?g.name:"goal")),`${RM(ex.amount)} on ${dLabel(ex.date)}.`,"Delete this entry",()=>{delTx(ex.id);if(ex.plan){const l=findLine(ex.plan.m,ex.plan.k);if(l)setLine(ex.plan.m,l,{paid:false,paidOn:null,txId:null});}commit();},true);}
  const tx=ex?clone(ex):{type:"expense",amount:"",account:defAcc(),toAccount:"",category:"",note:"",date:todayStr()};
  let showAll=false;
  const draw=sh=>{
    const all=allCats(tx.type),list=showAll?all:all.slice(0,12);
    if(tx.category&&!list.includes(tx.category)&&all.includes(tx.category))list.push(tx.category);
    sh.querySelector("#t-cats").innerHTML=list.map(c=>`<button data-c="${esc(c)}" class="${c===tx.category?"on":""}">${esc(c)}</button>`).join("")+(all.length>12&&!showAll?`<button data-more="1">More…</button>`:"");
    sh.querySelectorAll("#t-cats button").forEach(b=>b.onclick=()=>{if(b.dataset.more){showAll=true}else{tx.category=b.dataset.c;sh.querySelector("#t-custom").value="";}draw(sh);});
    sh.querySelector("#t-catwrap").hidden=tx.type==="transfer";
    sh.querySelector("#t-towrap").hidden=tx.type!=="transfer";
    sh.querySelectorAll("#t-seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===tx.type));
    sh.querySelector("#t-acclbl").textContent=tx.type==="income"?"Into":tx.type==="transfer"?"From":"Paid with";
    sh.querySelector("#t-gw").hidden=tx.type!=="expense";
  };
  const isCustom=tx.category&&!allCats(tx.type).includes(tx.category);
  openSheet(`<h2>${ex?"Edit":"Add"} transaction</h2>
  ${ex&&ex.plan?`<div class="banner" style="margin-bottom:10px"><span>From a planned item. Deleting it un-ticks it.</span></div>`:""}
  <div class="seg" id="t-seg"><button data-v="expense">Expense</button><button data-v="income">Income</button><button data-v="transfer">Transfer</button></div>
  <div class="field"><input class="amt-in num" id="t-amt" inputmode="decimal" placeholder="0.00" value="${tx.amount}"></div>
  <div id="t-catwrap" class="field"><label>Category</label><div class="chips" id="t-cats"></div><input id="t-custom" style="margin-top:8px" placeholder="Or type a new category" value="${isCustom?esc(tx.category):""}">
  <div id="t-gw" style="margin-top:8px" hidden><select id="t-grp" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)"><option value="">New category goes in group…</option>${groupOptions("other")}</select></div></div>
  <div class="row2"><div class="field"><label id="t-acclbl">Paid with</label><select id="t-acc">${accOptions(tx.account)}</select></div><div class="field"><label>Date</label><input type="date" id="t-date" value="${tx.date}"></div></div>
  <div class="field" id="t-towrap"><label>To</label><select id="t-to">${accOptions(tx.toAccount||(accounts().find(a=>a.id!==tx.account)||{}).id)}</select></div>
  <div class="field"><label>Note</label><input id="t-note" placeholder="optional" value="${esc(tx.note||"")}"></div>
  <button class="btn" id="t-ok">${ex?"Save":"Add"}</button>
  ${ex?`<div class="btns"><button class="btn danger" id="t-del">Delete</button></div>`:""}`,sh=>{
    sh.querySelectorAll("#t-seg button").forEach(b=>b.onclick=()=>{tx.type=b.dataset.v;if(!allCats(tx.type).includes(tx.category))tx.category="";draw(sh);});
    draw(sh);
    sh.querySelector("#t-ok").onclick=()=>{
      const amt=num(sh.querySelector("#t-amt").value);if(amt<=0){toast("Enter an amount");return}
      const custom=sh.querySelector("#t-custom").value.trim();
      const out={id:ex?ex.id:rid(),type:tx.type,amount:amt,account:sh.querySelector("#t-acc").value,date:sh.querySelector("#t-date").value||todayStr(),note:sh.querySelector("#t-note").value.trim(),created:ex?ex.created||Date.now():Date.now()};
      if(tx.type==="transfer"){out.toAccount=sh.querySelector("#t-to").value;if(out.toAccount===out.account){toast("Pick two different accounts");return}if(ex&&ex.category)out.category=ex.category;}
      else{out.category=custom||tx.category||"Others";if(custom)ensureCat(custom,tx.type,sh.querySelector("#t-grp").value||"other");}
      for(const k of ["plan","src","goalId","withdraw"])if(ex&&ex[k]!=null)out[k]=ex[k];
      putTx(out);commit();closeSheet();toast(ex?"Saved":"Added");
    };
    const del=sh.querySelector("#t-del");
    if(del)del.onclick=()=>{
      delTx(ex.id);
      if(ex.plan){const {m,k}=ex.plan;if(k.startsWith("i:"))setInc(m,k.slice(2),{received:null,txId:null});else{const l=findLine(m,k);if(l)setLine(m,l,{paid:false,paidOn:null,txId:null});}}
      commit();closeSheet();toast("Deleted");
    };
  });
}

  ask("Remove "+esc(a.name)+"?","It has no transactions, so nothing else changes.","Remove",()=>{S().accounts=accounts().filter(z=>z.id!==a.id);items().forEach(i=>{if(i.payFrom===a.id)i.payFrom=null;if(i.payTo===a.id)i.payTo=null;});goals().forEach(g=>{if(g.account===a.id)g.account=null});commit();},true);

/* ---------- backup / import ---------- */
function backup(){
  S().lastBackup=Date.now();save();
  const blob=new Blob([JSON.stringify({app:"earmark",v:2,exported:new Date().toISOString(),data:D})],{type:"application/json"});
  const name="earmark-backup-"+todayStr()+".json";
  let file=null;try{file=new File([blob],name,{type:"application/json"})}catch(_){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);}
  render();toast("Backup ready");
}
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function guessType(n){n=n.toLowerCase();
  if(/paylater|atome|\bcc\b|credit|card|loan|spaylater|pinjaman|hutang/.test(n))return "credit";
  if(/cash|tunai/.test(n))return "cash";
  if(/tng|touch|boost|shopee|wallet|bigpay|grabpay|setel/.test(n))return "ewallet";
  if(/asb|tabung|saving|simpan|invest|\bfd\b|versa|stash/.test(n))return "savings";
  return "bank";}
function importMoneyPlus(text){
  const rows=parseCSV(text.replace(/^﻿/,""));
  const hi=rows.findIndex(r=>r[0]==="Date"&&r[1]==="Category"&&r[2]==="Amount");
  if(hi<0)return null;
  const H=rows[hi],ix=k=>H.indexOf(k);
  const iD=ix("Date"),iC=ix("Category"),iA=ix("Amount"),iT=ix("Type"),iAc=ix("Account"),iN=ix("Note"),iTo=ix("Transfer to");
  const seen=new Set(D.tx.map(x=>x.src).filter(Boolean));
  const accFor=name=>{name=(name||"").trim()||"Imported";let a=accounts().find(x=>x.name.toLowerCase()===name.toLowerCase());if(!a){const t=guessType(name);a={id:rid(),name,type:t,opening:0};if(t==="credit"){a.kind=/loan/i.test(name)?"loan":/paylater|atome/i.test(name)?"paylater":"card";a.rate=a.kind==="card"?18:0;a.plans=[];}accounts().push(a);}return a.id;};
  let added=0,skipped=0;const newAcc=accounts().length;
  for(const r of rows.slice(hi+1)){
    if(!r[iD]||!/^\d{4}-\d{2}-\d{2}/.test(r[iD]))continue;
    const type=(r[iT]||"").toLowerCase(),amt=num(r[iA]);if(!amt)continue;
    const src="mp|"+r[iD]+"|"+amt+"|"+type+"|"+r[iAc]+"|"+(r[iTo]||"");
    if(seen.has(src)){skipped++;continue}seen.add(src);
    const t={id:rid(),date:r[iD].slice(0,10),created:Date.parse(r[iD].replace(" ","T"))||Date.now(),amount:Math.abs(amt),account:accFor(r[iAc]),note:(r[iN]||"").trim(),src};
    if(type==="transfer"){t.type="transfer";t.toAccount=accFor(r[iTo]);}
    else{t.type=type==="income"?"income":"expense";t.category=(r[iC]||"Others").trim();ensureCat(t.category,t.type,"other");}
    D.tx.push(t);added++;
  }
  return {added,skipped,newAccounts:accounts().length-newAcc};
}
function restoreJson(json){
  const go=()=>{D=normalize(json.data);S().lastBackup=Date.now();save();UI.tab="home";render();closeSheet();toast("Your data is loaded");};
  if(D&&(D.tx.length||items().length))ask("Replace everything?","This replaces all the data on this phone with the backup.","Replace",go,true);else go();
}
async function decodeSetup(code){
  code=String(code).trim().replace(/^.*#setup=/,"").replace(/\s+/g,"");
  const b64=code.replace(/-/g,"+").replace(/_/g,"/");
  const bin=Uint8Array.from(atob(b64+"===".slice((b64.length+3)%4)),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  const json=JSON.parse(txt);if(!json||!json.data||!json.data.settings)throw new Error("bad");return json;
}
function sheetSetupCode(){
  openSheet(`<h2>Paste a setup code</h2><p class="small muted" style="margin-top:-8px">Paste the code (or the whole setup link) you were given.</p><div class="field"><textarea id="sc-t" placeholder="Paste here"></textarea></div><button class="btn" id="sc-ok">Load my data</button>`,sh=>{
    sh.querySelector("#sc-ok").onclick=async()=>{try{restoreJson(await decodeSetup(sh.querySelector("#sc-t").value));}catch(e){toast("That code didn't work — check it was copied in full");}};
  });
}
function handleFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    const text=String(rd.result);
    let json=null;try{json=JSON.parse(text)}catch(_){}
    if(json&&json.data&&json.data.settings){restoreJson(json);return;}
    if(!D)D=freshData();
    const res=importMoneyPlus(text);
    if(!res){toast("That file isn't a backup or a Money+ export");return}
    S().balanceSet=false;commit();closeSheet();
    openSheet(`<h2>Imported from Money+</h2><p>${res.added} transactions added${res.skipped?`, ${res.skipped} already here`:""}.${res.newAccounts?` ${res.newAccounts} accounts created.`:""}</p><p class="small muted">New categories went into “Others” — move them to the right group under Settings → Categories. Money+ doesn't export balances, so enter what's in each account now.</p><div class="btns"><button class="btn" data-act="accounts">Enter balances</button><button class="btn ghost" data-act="cats">Sort categories</button></div>`);
  };
  rd.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case "tab":UI.tab=ds.tab;closeSheet();render();window.scrollTo(0,0);break;
    case "close":closeSheet();break;
    case "start":D=freshData();commit();break;
    case "pm":UI.viewMonth=addM(UI.viewMonth||thisYM(),+ds.d);render();break;
    case "am":UI.actMonth=addM(UI.actMonth||thisYM(),+ds.d);UI.openGroup=null;render();break;
    case "opengrp":UI.openGroup=UI.openGroup===ds.g?null:ds.g;render();break;
    case "pay":sheetPay(ds.m,ds.k);break;
    case "toggle":{const l=findLine(ds.m,ds.k);if(l)(l.paid?sheetUnpay:sheetPay)(ds.m,ds.k);break;}
    case "line":sheetLine(ds.m,ds.k);break;
    case "inctoggle":{const l=incomeLines(ds.m).find(x=>x.id===ds.k);if(!l)break;if(l.received)ask(esc(l.name),"Mark as not received? This removes the income it recorded.","Mark as not received",()=>{if(l.txId)delTx(l.txId);setInc(ds.m,l.id,{received:null,txId:null});commit();},true);else sheetReceive(ds.m,ds.k);break;}
    case "incline":sheetIncLine(ds.m,ds.k);break;
    case "receive":sheetReceive(ds.m,ds.k);break;
    case "incomes":sheetIncomes();break;
    case "income":sheetIncome(ds.id||null);break;
    case "addplan":sheetAddPlan(ds.m||thisYM());break;
    case "addtx":sheetTx(null);break;
    case "edittx":sheetTx(ds.id);break;
    case "accounts":sheetAccounts();break;
    case "account":sheetAccount(ds.id||null);break;
    case "credit":sheetCredit(ds.id||null);break;
    case "items":sheetItems();break;
    case "item":sheetItem(ds.id);break;
    case "groups":sheetGroups();break;
    case "cats":sheetCats("expense");break;
    case "cat":sheetCat(ds.n||null,ds.t);break;
    case "goal":sheetGoal._edit=false;sheetGoal(ds.id);break;
    case "addgoal":sheetGoal._edit=true;sheetGoal(null);break;
    case "settings":sheetSettings();break;
    case "currency":sheetCurrency();break;
    case "backup":backup();break;
    case "setupcode":sheetSetupCode();break;
    case "import":$("#filein").value="";$("#filein").click();break;
    case "wipe":ask("Delete everything?","This removes all your data from this phone. Save a backup first if you might want it back.","Delete everything",()=>{try{localStorage.removeItem(KEY)}catch(_){}D=null;UI.tab="home";render();},true);break;
  }
});
$("#filein").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f);});

/* ---------- boot ---------- */
D=load();if(D)normalize(D);
render();
if(location.hash.startsWith("#setup=")){const code=location.hash;try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}
  decodeSetup(code).then(restoreJson).catch(()=>toast("That setup link didn't work"));}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
